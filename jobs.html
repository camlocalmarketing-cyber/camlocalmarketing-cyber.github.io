/* Split-screen frame and shared widgets (sign-in, checkout, email, toasts).
   Layout: a slim top bar, then two independently scrolling panes. */

:root {
  --frame-bg: #e9ebee;
  --frame-bar: #ffffff;
  --frame-ink: #1b2027;
  --frame-muted: #5d6673;
  --frame-line: #d5d9df;
  --frame-accent: #1f6feb;
  --frame-ping: #f2b705;
  --frame-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --frame-bg: #0f1216;
    --frame-bar: #171b21;
    --frame-ink: #e7eaee;
    --frame-muted: #9aa3ae;
    --frame-line: #2a3039;
    --frame-accent: #5b9dff;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --frame-bg: #0f1216;
  --frame-bar: #171b21;
  --frame-ink: #e7eaee;
  --frame-muted: #9aa3ae;
  --frame-line: #2a3039;
  --frame-accent: #5b9dff;
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}
html,
body.dm-body {
  height: 100%;
}
body.dm-body {
  margin: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--frame-bg);
  color: var(--frame-ink);
  font-family: var(--frame-ui);
  overflow: hidden;
}
body.dm-body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--frame-bar);
}

.dm-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--frame-bar);
  border-bottom: 1px solid var(--frame-line);
  z-index: 5;
}
.dm-id {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  flex: 1 1 260px;
}
.dm-id h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.dm-id p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--frame-muted);
}
.dm-back {
  flex: none;
  font-size: 12px;
  color: var(--frame-muted);
  text-decoration: none;
  padding: 6px 10px;
  border: 1px solid var(--frame-line);
  border-radius: 6px;
}
.dm-back:hover {
  color: var(--frame-ink);
}

.dm-views {
  display: flex;
  padding: 3px;
  border-radius: 8px;
  background: var(--frame-bg);
  border: 1px solid var(--frame-line);
}
.dm-views button,
.dm-tool {
  font: 500 13px/1 var(--frame-ui);
  color: var(--frame-muted);
  background: none;
  border: 0;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.dm-views button[aria-pressed='true'] {
  background: var(--frame-bar);
  color: var(--frame-ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
.dm-tools {
  display: flex;
  gap: 6px;
}
.dm-tool[data-tool='reset'] {
  min-width: 5.5em;
  justify-content: center;
}
.dm-tool {
  border: 1px solid var(--frame-line);
}
.dm-tool:hover,
.dm-views button:hover {
  color: var(--frame-ink);
}
.dm-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--frame-ping);
  color: #1b1600;
  font-size: 11px;
  font-weight: 700;
  display: inline-grid;
  place-items: center;
}
.dm-guide {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(100% + 6px);
  width: min(420px, calc(100vw - 32px));
  margin: 0;
  padding: 16px 18px 16px 36px;
  background: var(--frame-bar);
  color: var(--frame-ink);
  border: 1px solid var(--frame-line);
  border-radius: 10px;
  box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.35);
  font-size: 14px;
  line-height: 1.5;
  display: grid;
  gap: 8px;
}

.dm-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--frame-line);
  min-height: 0;
}
.dm-split[data-view='customer'],
.dm-split[data-view='owner'] {
  grid-template-columns: 1fr;
}
.dm-split[data-view='customer'] [data-pane='owner'],
.dm-split[data-view='owner'] [data-pane='customer'] {
  display: none;
}

.dm-pane {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--frame-bg);
}
.dm-plabel {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px max(16px, env(safe-area-inset-left, 0px));
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--frame-ink);
  background: var(--frame-bar);
  border-bottom: 1px solid var(--frame-line);
}
.dm-plabel small {
  font-weight: 400;
  color: var(--frame-muted);
}
.dm-live {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #2ea36a;
  box-shadow: 0 0 0 3px rgba(46, 163, 106, 0.18);
}
.dm-pane.is-pinged .dm-plabel {
  animation: dm-ping 1.4s ease-out;
}
@keyframes dm-ping {
  0% {
    background: var(--frame-ping);
  }
  100% {
    background: var(--frame-bar);
  }
}
.dm-scroll {
  display: grid;
  overflow: auto;
  min-height: 0;
  overscroll-behavior: contain;
}
.dm-app {
  display: grid;
  align-content: stretch;
  container-type: inline-size;
}
.dm-app > * {
  min-width: 0;
  align-self: start;
}

.dm-short {
  display: none;
}
@media (max-width: 860px) {
  .dm-wide-only {
    display: none !important;
  }
  .dm-long {
    display: none;
  }
  .dm-short {
    display: inline;
  }
  .dm-bar {
    gap: 8px;
  }
  .dm-id {
    flex-basis: 100%;
  }
  .dm-views {
    flex: 1;
  }
  .dm-views button {
    flex: 1;
    justify-content: center;
  }
}
@media (max-width: 420px) {
  .dm-tool {
    padding: 8px;
    font-size: 12px;
  }
  .dm-id p {
    display: none;
  }
}

/* ---- Shared widgets. Each demo sets the --dm-* colors on .dm-app. ---- */

.dm-app {
  --dm-accent: #1f6feb;
  --dm-on-accent: #fff;
  --dm-ink: #1b2027;
  --dm-muted: #5d6673;
  --dm-surface: #fff;
  --dm-line: #d5d9df;
  --dm-radius: 8px;
}
.dm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 20px;
  font: inherit;
  font-weight: 650;
  color: var(--dm-on-accent);
  background: var(--dm-accent);
  border: 0;
  border-radius: var(--dm-radius);
  cursor: pointer;
}
.dm-btn:disabled {
  opacity: 0.6;
  cursor: progress;
}
.dm-link {
  font: inherit;
  color: var(--dm-accent);
  background: none;
  border: 0;
  padding: 8px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dm-muted {
  color: var(--dm-muted);
}
.dm-hint {
  margin: -4px 0 0;
  font-size: 13px;
  color: var(--dm-muted);
}
.dm-err {
  margin: 0;
  padding: 10px 12px;
  border-radius: 6px;
  background: #fdecea;
  color: #8a1f11;
  font-size: 14px;
}

.dm-auth,
.dm-pay {
  display: grid;
  gap: 10px;
}
.dm-auth h3,
.dm-pay h3 {
  margin: 0;
}
.dm-auth label,
.dm-pay label {
  font-size: 13px;
  font-weight: 600;
  color: var(--dm-ink);
}
.dm-auth input,
.dm-pay input {
  width: 100%;
  box-sizing: border-box;
  min-height: 44px;
  padding: 0 12px;
  font: inherit;
  color: var(--dm-ink);
  background: var(--dm-surface);
  border: 1px solid var(--dm-line);
  border-radius: calc(var(--dm-radius) * 0.75);
}
.dm-auth input:focus,
.dm-pay input:focus,
.dm-btn:focus-visible,
.dm-link:focus-visible {
  outline: 2px solid var(--dm-accent);
  outline-offset: 2px;
}
.dm-seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--dm-line);
  border-radius: var(--dm-radius);
  overflow: hidden;
}
.dm-seg button {
  font: inherit;
  font-size: 14px;
  padding: 10px;
  border: 0;
  background: none;
  color: var(--dm-muted);
  cursor: pointer;
}
.dm-seg button[aria-selected='true'] {
  background: var(--dm-ink);
  color: var(--dm-surface);
}

.dm-layer {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(10, 12, 16, 0.55);
  overflow: auto;
}
.dm-pay {
  width: min(420px, 100%);
  box-sizing: border-box;
  padding: 22px;
  border-radius: 12px;
  background: #fff;
  color: #1a1f36;
  font-family: var(--frame-ui);
  font-size: 15px;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
  --dm-accent: #635bff;
  --dm-on-accent: #fff;
  --dm-ink: #1a1f36;
  --dm-muted: #5e6479;
  --dm-surface: #fff;
  --dm-line: #d8dbe4;
  --dm-radius: 8px;
}
.dm-pay-mode {
  justify-self: start;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8a4b00;
  background: #ffe7c2;
  padding: 4px 8px;
  border-radius: 4px;
}
.dm-pay-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 8px;
}
.dm-pay-row > div {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.dm-pay-cards {
  font-size: 13px;
  color: #5e6479;
  border-top: 1px solid #e6e8ee;
  padding-top: 10px;
}
.dm-pay-cards summary {
  cursor: pointer;
  font-weight: 600;
  color: #1a1f36;
}
.dm-pay-cards ul {
  list-style: none;
  margin: 8px 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.dm-pay-cards button {
  font:
    12px ui-monospace,
    Menlo,
    Consolas,
    monospace;
  padding: 4px 6px;
  border: 1px solid #d8dbe4;
  border-radius: 4px;
  background: #f6f8fa;
  cursor: pointer;
  color: #1a1f36;
}

.dm-mail {
  padding: 16px 18px;
  border: 1px solid var(--dm-line);
  border-radius: var(--dm-radius);
  background: var(--dm-surface);
  color: var(--dm-ink);
  font-size: 14px;
  line-height: 1.5;
}
.dm-mail header {
  border-bottom: 1px solid var(--dm-line);
  margin-bottom: 10px;
  padding-bottom: 8px;
}
.dm-mail h4 {
  margin: 6px 0 0;
  font-size: 15px;
}
.dm-mail p {
  margin: 0 0 8px;
}
.dm-mail-from {
  font-weight: 650;
}
.dm-mail-from span,
.dm-mail-to {
  font-size: 12px;
  color: var(--dm-muted);
  font-weight: 400;
}
.dm-mail-code {
  font:
    700 26px/1 ui-monospace,
    Menlo,
    Consolas,
    monospace;
  letter-spacing: 0.3em;
  padding: 12px 0 4px;
  user-select: all;
}

.dm-toasts {
  position: absolute;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  display: grid;
  justify-items: center;
  gap: 8px;
  pointer-events: none;
}
.dm-toast {
  padding: 10px 16px;
  border-radius: 8px;
  background: #1b2027;
  color: #fff;
  font: 500 14px/1.35 var(--frame-ui);
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
  transition:
    opacity 0.3s,
    transform 0.3s;
}
.dm-toast.is-out {
  opacity: 0;
  transform: translateY(8px);
}

@media (prefers-reduced-motion: reduce) {
  .dm-pane.is-pinged .dm-plabel {
    animation: none;
  }
  .dm-toast {
    transition: none;
  }
}

/* Tarrant Works. Job-site signage: heavy black type, safety yellow, square
   corners and thick rules. The employer dashboard keeps the same parts but
   packs them into a hiring board. */

#customer,
#owner,
.tw-panel {
  --ink: #121212;
  --yellow: #ffd23f;
  --paper: #ffffff;
  --ground: #f3f2ee;
  --muted: #5f5d57;
  --line: #121212;
  --soft: #d9d6cc;
  --go: #1d6b45;
  --display: 'Archivo Black', 'Archivo', system-ui, sans-serif;
  --body: 'Archivo', system-ui, sans-serif;
  --dm-accent: var(--ink);
  --dm-on-accent: var(--yellow);
  --dm-ink: var(--ink);
  --dm-muted: var(--muted);
  --dm-surface: #fff;
  --dm-line: var(--soft);
  --dm-radius: 0;
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--ground);
}
.tw-vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.tw-sample {
  margin: 0;
  padding: 7px 16px;
  text-align: center;
  font-size: 12px;
  background: var(--ink);
  color: var(--yellow);
}
.tw-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 22px;
  background: var(--yellow);
  border-bottom: 3px solid var(--ink);
}
.tw-logo {
  font: 400 22px/1 var(--display);
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.tw-logo b {
  font-weight: 400;
  background: var(--ink);
  color: var(--yellow);
  padding: 0 5px;
  margin-left: 3px;
}
.tw-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}
.tw-nav button {
  font: 600 14px var(--body);
  padding: 8px 10px;
  border: 0;
  background: none;
  color: var(--ink);
  cursor: pointer;
}
.tw-nav button[aria-pressed='true'] {
  background: var(--ink);
  color: var(--yellow);
}

.tw-hero {
  padding: 34px 22px 26px;
  display: grid;
  gap: 14px;
  background: var(--paper);
  border-bottom: 3px solid var(--ink);
}
.tw-hero h2 {
  margin: 0;
  font: 400 clamp(36px, 8.5cqi, 72px)/0.92 var(--display);
  text-transform: uppercase;
  letter-spacing: -0.03em;
}
.tw-hero p {
  margin: 0;
  max-width: 50ch;
  color: var(--muted);
}
.tw-search {
  display: grid;
  grid-template-columns: 1fr auto;
  border: 3px solid var(--ink);
  max-width: 640px;
}
.tw-search input,
.tw-search select {
  font: inherit;
  font-size: 16px;
  min-height: 48px;
  padding: 0 14px;
  border: 0;
  background: #fff;
  color: var(--ink);
  min-width: 0;
}
.tw-search select {
  border-left: 3px solid var(--ink);
  font-weight: 600;
}
.tw-search input:focus,
.tw-search select:focus {
  outline: 3px solid var(--yellow);
  outline-offset: -6px;
}

.tw-body {
  padding: 22px 22px 40px;
}
.tw-layout {
  display: grid;
  gap: 18px;
}
@container (min-width: 640px) {
  .tw-layout {
    grid-template-columns: 190px 1fr;
    gap: 26px;
  }
}
.tw-filters {
  display: grid;
  gap: 16px;
  align-content: start;
}
.tw-filters fieldset {
  margin: 0;
  padding: 0;
  border: 0;
  display: grid;
  gap: 6px;
}
.tw-filters legend {
  font: 400 13px var(--display);
  text-transform: uppercase;
  margin-bottom: 4px;
  padding: 0;
}
.tw-filters label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  cursor: pointer;
}
.tw-filters input {
  width: 18px;
  height: 18px;
  accent-color: var(--ink);
}
.tw-filters select {
  font: inherit;
  min-height: 40px;
  padding: 0 10px;
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--ink);
}
.tw-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tw-cats button {
  font: 600 13px var(--body);
  padding: 6px 10px;
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
.tw-cats button[aria-pressed='true'] {
  background: var(--yellow);
}
.tw-count {
  margin: 0 0 10px;
  font-weight: 700;
}
.tw-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.tw-job {
  display: grid;
  grid-template-columns: 1fr auto;
  background: var(--paper);
  border: 2px solid var(--ink);
}
.tw-job:hover {
  box-shadow: 5px 5px 0 var(--ink);
}
.tw-job-main {
  display: grid;
  gap: 4px;
  padding: 14px 16px;
  text-align: left;
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  min-width: 0;
}
.tw-job-main b {
  font-size: 18px;
  line-height: 1.2;
}
.tw-job-co {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
  margin: 0;
}
.tw-job-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}
.tw-job-meta em {
  font-style: normal;
  font-weight: 800;
  color: var(--ink);
  background: var(--yellow);
  padding: 0 6px;
}
.tw-job-side {
  display: grid;
  align-content: space-between;
  justify-items: end;
  gap: 8px;
  padding: 14px 16px;
  font-size: 12px;
  color: var(--muted);
}
.tw-save {
  font: 700 12px var(--body);
  padding: 6px 10px;
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
.tw-save[aria-pressed='true'] {
  background: var(--ink);
  color: var(--yellow);
}
@container (max-width: 420px) {
  .tw-job {
    grid-template-columns: 1fr;
  }
  .tw-job-side {
    grid-auto-flow: column;
    justify-content: space-between;
    padding-top: 0;
  }
}
.tw-none {
  padding: 18px;
  border: 2px dashed var(--soft);
  color: var(--muted);
}
.tw-companies {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.tw-companies button {
  display: grid;
  gap: 4px;
  justify-items: start;
  width: 100%;
  height: 100%;
  padding: 16px;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--paper);
  border: 2px solid var(--ink);
  cursor: pointer;
}
.tw-companies button:hover {
  box-shadow: 5px 5px 0 var(--ink);
}
.tw-companies span:not(.tw-mark) {
  font-size: 13px;
  color: var(--muted);
}
.tw-companies em {
  font-style: normal;
  font-weight: 700;
  font-size: 13px;
  margin-top: 6px;
}
.tw-mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--yellow);
  font: 400 20px var(--display);
  flex: none;
}
.tw-back,
.tw-link {
  font: 600 14px var(--body);
  background: none;
  border: 0;
  padding: 0;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.tw-company {
  display: flex;
  gap: 16px;
  padding: 18px;
  margin: 12px 0 20px;
  background: var(--paper);
  border: 2px solid var(--ink);
}
.tw-company h3 {
  margin: 0;
  font: 400 24px var(--display);
  text-transform: uppercase;
}
.tw-company p {
  margin: 4px 0 0;
}
.tw-co-meta {
  color: var(--muted);
  font-size: 14px;
}
.tw-h4 {
  margin: 18px 0 10px;
  font: 400 15px var(--display);
  text-transform: uppercase;
}
.tw-mine-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tw-mine-head h3 {
  margin: 0;
  font: 400 26px var(--display);
  text-transform: uppercase;
}
.tw-apps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.tw-apps > li {
  display: grid;
  gap: 8px;
  padding: 14px 16px;
  background: var(--paper);
  border: 2px solid var(--ink);
}
.tw-apps span {
  display: block;
  font-size: 13px;
  color: var(--muted);
}
.tw-steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
}
.tw-steps li {
  padding-top: 5px;
  border-top: 5px solid var(--soft);
}
.tw-steps li.is-done {
  border-color: var(--ink);
  color: var(--ink);
  font-weight: 700;
}
.tw-interview {
  margin: 0;
  padding: 8px 10px;
  background: var(--yellow);
  font-weight: 700;
  font-size: 14px;
}
.tw-declined {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}
.tw-authbox {
  max-width: 420px;
  padding: 18px;
  background: var(--paper);
  border: 2px solid var(--ink);
}
.tw-mail {
  display: grid;
  gap: 10px;
}
.tw-note {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}

.tw-panel {
  position: absolute;
  inset: 33px 0 0 auto;
  z-index: 20;
  width: min(460px, 100%);
  background: var(--paper);
  border-left: 3px solid var(--ink);
  overflow: auto;
  overscroll-behavior: contain;
}
.tw-panel-in {
  display: grid;
  gap: 12px;
  padding: 22px;
}
.tw-panel h3 {
  margin: 0;
  padding-right: 70px;
  font: 400 26px/1.05 var(--display);
  text-transform: uppercase;
}
.tw-panel p {
  margin: 0;
}
.tw-about {
  font-size: 14px;
  padding: 12px;
  background: var(--ground);
}
.tw-x {
  position: absolute;
  top: 18px;
  right: 18px;
  font: 700 13px var(--body);
  padding: 7px 10px;
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
.tw-apply {
  font: 400 16px var(--display);
  text-transform: uppercase;
  padding: 14px 18px;
  border: 0;
  background: var(--ink);
  color: var(--yellow);
  cursor: pointer;
  justify-self: start;
}
.tw-apply:hover {
  box-shadow:
    4px 4px 0 var(--yellow),
    6px 6px 0 var(--ink);
}
.tw-applied,
.tw-closed {
  padding: 12px;
  font-weight: 700;
  background: var(--yellow);
}
.tw-closed {
  background: var(--ground);
}
.tw-form {
  display: grid;
  gap: 6px;
  padding-top: 14px;
  border-top: 3px solid var(--ink);
}
.tw-form h4 {
  margin: 0 0 6px;
  font: 400 16px var(--display);
  text-transform: uppercase;
}
.tw-form label {
  font-size: 13px;
  font-weight: 700;
  margin-top: 6px;
}
.tw-form label span {
  font-weight: 400;
  color: var(--muted);
}
.tw-form input,
.tw-form textarea {
  font: inherit;
  padding: 10px 12px;
  min-height: 44px;
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--ink);
  box-sizing: border-box;
  width: 100%;
}
.tw-form input[type='file'] {
  padding: 8px;
}
.tw-form .tw-apply {
  margin-top: 8px;
}

/* ---- Employer view ---- */
#owner {
  background: #ebe9e2;
}
.two {
  display: grid;
  gap: 14px;
  padding: 18px 22px 30px;
}
.two-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.two-head > div {
  display: flex;
  gap: 12px;
  align-items: center;
}
.two-head b {
  display: block;
  font: 400 18px var(--display);
  text-transform: uppercase;
}
.two-head span:not(.tw-mark) {
  font-size: 13px;
  color: var(--muted);
}
.two-btn {
  font: 700 13px var(--body);
  padding: 8px 12px;
  min-height: 36px;
  border: 2px solid var(--ink);

  cursor: pointer;
}

.two-stats {

.two-stats b {

.two-stats span {

  color: var(--muted);
}
.two-stats .is-new {

.two-jobs h4,
.two-feed h4,
.two-col h4 {

.two-jobs li > button:first-child[aria-pressed='true'] {

.two-jobs li span {

.two-board {

.two-col h4 span {
  background: var(--ink);
  color: var(--yellow);
  padding: 0 6px;
}
.two-app {

  gap: 8px;
  padding: 10px;
  background: var(--paper);
  border: 2px solid var(--ink);
  font-size: 13px;
}
.two-app.is-fresh {

    4px 4px 0 var(--yellow),
    4px 4px 0 2px var(--ink);
}
.two-app-top {
  display: grid;
  text-align: left;
  font: inherit;
  background: none;
  border: 0;
  padding: 0;
  color: var(--ink);
  cursor: pointer;
}
.two-app-top b {
  font-size: 15px;
}
.two-app-top span {
  color: var(--muted);
  font-size: 12px;
}
.two-app dl {
  margin: 0;
  display: grid;

</style>
</head>
<body>
<script>
// Shared runtime for the split-screen demos: a small local data store,
// demo email, sign-in, a test-mode card checkout and the split-screen frame.
// Everything runs in the browser. Nothing is sent over the network.

(function () {
  'use strict';

  const Demo = {};

  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  Demo.esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ESCAPES[c]);

  Demo.money = (cents, { round = false } = {}) => {
    const dollars = cents / 100;
    return dollars.toLocaleString('en-US', {
      style: 'currency',
      currency: 'USD',
      maximumFractionDigits: round ? 0 : 2,
      minimumFractionDigits: round ? 0 : 2,
    });
  };

  Demo.uid = (prefix) => {
    const bytes = crypto.getRandomValues(new Uint8Array(5));
    return (
      prefix +
      '_' +
      Array.from(bytes, (b) => b.toString(36).padStart(2, '0'))
        .join('')
        .slice(0, 8)
    );
  };

  Demo.ago = (ts) => {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' hr ago';
    return Math.round(s / 86400) + ' d ago';
  };

  Demo.dayKey = (date) => {
    const d = new Date(date);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  Demo.addDays = (n, from = new Date()) => {
    const d = new Date(from);
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + n);
    return d;
  };

  Demo.fromDayKey = (key) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d, 12);
  };

  Demo.niceDay = (key, opts = { weekday: 'short', month: 'short', day: 'numeric' }) =>
    Demo.fromDayKey(key).toLocaleDateString('en-US', opts);

  Demo.niceTime = (hhmm) => {
    const [h, m] = hhmm.split(':').map(Number);
    const suffix = h >= 12 ? 'pm' : 'am';
    const hour = ((h + 11) % 12) + 1;
    return m ? `${hour}:${String(m).padStart(2, '0')}${suffix}` : `${hour}${suffix}`;
  };

  // ---------------------------------------------------------------------------
  // Store
  //
  // One JSON document per demo, saved to localStorage when the browser allows
  // it. Both views read from the same store, so a change made on one side shows
  // up on the other right away. Other tabs stay in sync through the storage
  // event.

  Demo.createStore = function (key, seed) {
    const listeners = [];
    let state = read() || seed();

    function read() {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function write() {
      try {
        localStorage.setItem(key, JSON.stringify(state));
      } catch {
        // Storage can be blocked (private windows, previews). The demo keeps
        // working in memory for this visit.
      }
    }

    function emit(event) {
      listeners.forEach((fn) => fn(event));
    }

    function commit(event) {
      event.at = Date.now();
      if (event.note) {
        state.activity = state.activity || [];
        state.activity.unshift({ id: Demo.uid('act'), at: event.at, by: event.by, note: event.note });
        state.activity.length = Math.min(state.activity.length, 80);
      }
      write();
      emit(event);
    }

    window.addEventListener('storage', (e) => {
      if (e.key !== key) return;
      const fresh = read();
      if (fresh) {
        state = fresh;
        emit({ action: 'sync' });
      }
    });

    const store = {
      get state() {
        return state;
      },
      list(table) {
        return state[table] || (state[table] = []);
      },
      find(table, id) {
        return store.list(table).find((row) => row.id === id);
      },
      insert(table, row, { by, note } = {}) {
        row.id = row.id || Demo.uid(table.slice(0, 3));
        row.createdAt = row.createdAt || Date.now();
        store.list(table).unshift(row);
        commit({ table, action: 'insert', row, by, note });
        return row;
      },
      update(table, id, patch, { by, note } = {}) {
        const row = store.find(table, id);
        if (!row) return null;
        Object.assign(row, patch, { updatedAt: Date.now() });
        commit({ table, action: 'update', row, by, note });
        return row;
      },
      remove(table, id, { by, note } = {}) {
        state[table] = store.list(table).filter((row) => row.id !== id);
        commit({ table, action: 'remove', id, by, note });
      },
      setting(name, value, { by, note } = {}) {
        state.settings = state.settings || {};
        if (value === undefined) return state.settings[name];
        state.settings[name] = value;
        commit({ table: 'settings', action: 'update', name, by, note });
        return value;
      },
      // Save and notify without changing a table (used for session changes).
      touch({ by, note } = {}) {
        commit({ action: 'touch', by, note });
      },
      on(fn) {
        listeners.push(fn);
      },
      reset() {
        state = seed();
        write();
        emit({ action: 'reset' });
      },
    };

    return store;
  };

  // ---------------------------------------------------------------------------
  // Demo email
  //
  // Messages land in an "outbox" table instead of being sent. The customer
  // view shows the ones addressed to the signed-in visitor as an inbox, and the
  // owner view lists everything the business would have sent.

  Demo.sendEmail = function (store, { to, subject, lines, code, by = 'system' }) {
    return store.insert('outbox', { to: to.toLowerCase(), subject, lines, code: code || null, read: false }, { by });
  };

  Demo.renderEmail = function (mail, brand) {
    const body = mail.lines.map((line) => `<p>${Demo.esc(line)}</p>`).join('');
    const code = mail.code ? `<div class="dm-mail-code">${Demo.esc(mail.code)}</div>` : '';
    return `
      <article class="dm-mail">
        <header>
          <div class="dm-mail-from">${Demo.esc(brand)} <span>&lt;no-reply@sample.test&gt;</span></div>
          <div class="dm-mail-to">To: ${Demo.esc(mail.to)} · ${Demo.ago(mail.createdAt)}</div>
          <h4>${Demo.esc(mail.subject)}</h4>
        </header>
        ${body}${code}
      </article>`;
  };

  // ---------------------------------------------------------------------------
  // Accounts
  //
  // Passwords are hashed with PBKDF2 (Web Crypto) before they are stored.
  // New accounts confirm their email with a six-digit code, and repeated wrong
  // passwords lock sign-in for 30 seconds.

  const PBKDF2_ROUNDS = 120000;
  const LOCK_AFTER = 5;
  const LOCK_MS = 30000;

  const toHex = (buffer) => Array.from(new Uint8Array(buffer), (b) => b.toString(16).padStart(2, '0')).join('');

  async function hashPassword(password, saltHex) {
    const salt = saltHex ? Uint8Array.from(saltHex.match(/../g), (h) => parseInt(h, 16)) : crypto.getRandomValues(new Uint8Array(16));
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: PBKDF2_ROUNDS }, keyMaterial, 256);
    return { salt: toHex(salt), hash: toHex(bits) };
  }

  function sixDigitCode() {
    const n = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;
    return String(n).padStart(6, '0');
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  Demo.createAuth = function (store, { brand }) {
    const failures = {};

    function sendCode(user) {
      const code = sixDigitCode();
      store.update('users', user.id, { code, codeExpires: Date.now() + 10 * 60 * 1000 });
      Demo.sendEmail(store, {
        to: user.email,
        subject: `Your ${brand} confirmation code`,
        lines: [`Hi ${user.name.split(' ')[0]},`, 'Enter this code to confirm your email address. It expires in 10 minutes.'],
        code,
      });
    }

    const auth = {
      current() {
        const session = store.state.session;
        return session ? store.find('users', session.userId) || null : null;
      },

      async signUp({ name, email, password }) {
        name = name.trim();
        email = email.trim().toLowerCase();
        if (name.length < 2) throw new Error('Enter your name.');
        if (!EMAIL_RE.test(email)) throw new Error('Enter a valid email address.');
        if (password.length < 8) throw new Error('Use at least 8 characters for your password.');
        if (store.list('users').some((u) => u.email === email)) throw new Error('That email already has an account. Sign in instead.');
        const { salt, hash } = await hashPassword(password);
        const user = store.insert('users', { name, email, salt, hash, verified: false }, { by: 'customer', note: `New account: ${name}` });
        sendCode(user);
        return user;
      },

      verify(email, code) {
        const user = store.list('users').find((u) => u.email === email.trim().toLowerCase());
        if (!user) throw new Error('We could not find that account.');
        if (!user.code || Date.now() > user.codeExpires) throw new Error('That code has expired. Send a new one.');
        if (code.trim() !== user.code) throw new Error('That code does not match. Check the latest email.');
        store.state.session = { userId: user.id, at: Date.now() };
        store.update('users', user.id, { verified: true, code: null }, { by: 'customer', note: `${user.name} confirmed their email` });
        return user;
      },

      resend(email) {
        const user = store.list('users').find((u) => u.email === email.trim().toLowerCase());
        if (user && !user.verified) sendCode(user);
      },

      async signIn(email, password) {
        email = email.trim().toLowerCase();
        const lock = failures[email];
        if (lock && lock.until > Date.now()) {
          throw new Error(`Too many attempts. Try again in ${Math.ceil((lock.until - Date.now()) / 1000)} seconds.`);
        }
        const user = store.list('users').find((u) => u.email === email);
        const attempt = user ? await hashPassword(password, user.salt) : null;
        if (!user || attempt.hash !== user.hash) {
          const f = (failures[email] = failures[email] || { count: 0, until: 0 });
          f.count += 1;
          if (f.count >= LOCK_AFTER) {
            f.count = 0;
            f.until = Date.now() + LOCK_MS;
          }
          throw new Error('Email or password is incorrect.');
        }
        delete failures[email];
        if (!user.verified) {
          sendCode(user);
          const err = new Error('Confirm your email first. We sent a new code.');
          err.needsCode = true;
          throw err;
        }
        store.state.session = { userId: user.id, at: Date.now() };
        store.touch();
        return user;
      },

      signOut() {
        store.state.session = null;
        store.touch();
      },
    };

    return auth;
  };

  // Sign-in / sign-up / confirm-code card. Calls onDone(user) when signed in.
  Demo.mountAuthForm = function (container, auth, { onDone, intro = 'Sign in or create a free account.' }) {
    // A fresh host element each time, so remounting never stacks listeners.
    const root = document.createElement('div');
    container.replaceChildren(root);
    let mode = 'signin';
    let pendingEmail = '';

    function render(error = '') {
      const err = error ? `<p class="dm-err" role="alert">${Demo.esc(error)}</p>` : '';
      if (mode === 'code') {
        root.innerHTML = `
          <form class="dm-auth" data-form="code" novalidate>
            <h3>Check your email</h3>
            <p class="dm-muted">We sent a six-digit code to <b>${Demo.esc(pendingEmail)}</b>. Open the demo inbox above to see it.</p>
            <label for="dm-code">Confirmation code</label>
            <input id="dm-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
            ${err}
            <button class="dm-btn" type="submit">Confirm email</button>
            <button class="dm-link" type="button" data-auth="resend">Send a new code</button>
          </form>`;
        return;
      }
      const signup = mode === 'signup';
      root.innerHTML = `
        <form class="dm-auth" data-form="${mode}" novalidate>
          <div class="dm-seg" role="tablist">
            <button type="button" role="tab" aria-selected="${!signup}" data-auth="signin">Sign in</button>
            <button type="button" role="tab" aria-selected="${signup}" data-auth="signup">Create account</button>
          </div>
          <p class="dm-muted">${Demo.esc(intro)}</p>
          ${signup ? '<label for="dm-name">Full name</label><input id="dm-name" name="name" autocomplete="name" required>' : ''}
          <label for="dm-email">Email</label>
          <input id="dm-email" name="email" type="email" autocomplete="email" value="${Demo.esc(pendingEmail)}" required>
          <label for="dm-pass">Password</label>
          <input id="dm-pass" name="password" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" minlength="8" required>
          ${signup ? '<p class="dm-hint">At least 8 characters. Use a made-up password, this is a demo.</p>' : ''}
          ${err}
          <button class="dm-btn" type="submit">${signup ? 'Create account' : 'Sign in'}</button>
        </form>`;
    }

    root.addEventListener('click', (e) => {
      const action = e.target.closest('[data-auth]')?.dataset.auth;
      if (!action) return;
      if (action === 'resend') {
        auth.resend(pendingEmail);
        render('A new code is in your inbox.');
        return;
      }
      mode = action;
      render();
    });

    root.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        if (mode === 'signup') {
          const user = await auth.signUp(data);
          pendingEmail = user.email;
          mode = 'code';
          render();
        } else if (mode === 'signin') {
          pendingEmail = data.email;
          onDone(await auth.signIn(data.email, data.password));
        } else {
          onDone(auth.verify(pendingEmail, data.code));
        }
      } catch (err) {
        if (err.needsCode) mode = 'code';
        render(err.message);
      }
    });

    render();
  };

  // ---------------------------------------------------------------------------
  // Test-mode card checkout
  //
  // Mirrors how Stripe behaves in test mode: only published test card numbers
  // work, so nobody can type a real card into a demo. The card number is never
  // stored; a successful payment keeps the brand and last four digits.

  const TEST_CARDS = {
    4242424242424242: { brand: 'Visa', result: 'ok' },
    5555555555554444: { brand: 'Mastercard', result: 'ok' },
    378282246310005: { brand: 'Amex', result: 'ok' },
    4000002500003155: { brand: 'Visa', result: 'auth' },
    4000000000000002: { brand: 'Visa', result: 'declined' },
    4000000000009995: { brand: 'Visa', result: 'funds' },
  };

  function passesLuhn(digits) {
    let sum = 0;
    for (let i = 0; i < digits.length; i++) {
      let n = Number(digits[digits.length - 1 - i]);
      if (i % 2) {
        n *= 2;
        if (n > 9) n -= 9;
      }
      sum += n;
    }
    return digits.length >= 13 && sum % 10 === 0;
  }

  function cardError(digits, expiry, cvc) {
    if (!passesLuhn(digits)) return 'Your card number is incomplete or invalid.';
    const match = expiry.match(/^(\d{2})\s*\/\s*(\d{2})$/);
    if (!match || Number(match[1]) < 1 || Number(match[1]) > 12) return 'Enter the expiration date as MM / YY.';
    const end = new Date(2000 + Number(match[2]), Number(match[1]), 1);
    if (end <= new Date()) return "Your card's expiration date is in the past.";
    if (!/^\d{3,4}$/.test(cvc)) return "Your card's security code is incomplete.";
    return '';
  }

  Demo.checkout = function (pane, { amount, label, email = '' }) {
    return new Promise((resolve, reject) => {
      const layer = document.createElement('div');
      layer.className = 'dm-layer';
      layer.innerHTML = `
        <form class="dm-pay" novalidate aria-labelledby="dm-pay-title">
          <div class="dm-pay-mode">Test mode · no real charge</div>
          <h3 id="dm-pay-title">Pay ${Demo.money(amount)}</h3>
          <p class="dm-muted">${Demo.esc(label)}</p>
          <label for="dm-pay-email">Email for receipt</label>
          <input id="dm-pay-email" name="email" type="email" value="${Demo.esc(email)}" autocomplete="email">
          <label for="dm-pay-card">Card number</label>
          <input id="dm-pay-card" name="card" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242">
          <div class="dm-pay-row">
            <div><label for="dm-pay-exp">Expiry</label><input id="dm-pay-exp" name="exp" inputmode="numeric" placeholder="MM / YY" autocomplete="off"></div>
            <div><label for="dm-pay-cvc">CVC</label><input id="dm-pay-cvc" name="cvc" inputmode="numeric" maxlength="4" placeholder="123" autocomplete="off"></div>
            <div><label for="dm-pay-zip">ZIP</label><input id="dm-pay-zip" name="zip" inputmode="numeric" maxlength="5" placeholder="76063" autocomplete="off"></div>
          </div>
          <p class="dm-err" role="alert" hidden></p>
          <button class="dm-btn" type="submit">Pay ${Demo.money(amount)}</button>
          <button class="dm-link" type="button" data-pay="cancel">Cancel</button>
          <details class="dm-pay-cards" open>
            <summary>Test cards</summary>
            <ul>
              <li><button type="button" data-fill="4242424242424242">4242 4242 4242 4242</button> payment succeeds</li>
              <li><button type="button" data-fill="4000002500003155">4000 0025 0000 3155</button> asks the bank to confirm</li>
              <li><button type="button" data-fill="4000000000000002">4000 0000 0000 0002</button> card is declined</li>
            </ul>
            <p>Use any future expiry and any 3 digits. Real cards are refused.</p>
          </details>
        </form>`;
      pane.appendChild(layer);

      const form = layer.querySelector('form');
      const errorBox = form.querySelector('.dm-err');
      const cardInput = form.card;
      const expInput = form.exp;
      cardInput.focus();

      cardInput.addEventListener('input', () => {
        const digits = cardInput.value.replace(/\D/g, '').slice(0, 16);
        cardInput.value = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
      });
      expInput.addEventListener('input', () => {
        const d = expInput.value.replace(/\D/g, '').slice(0, 4);
        expInput.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : d;
      });

      function close() {
        layer.remove();
      }

      function fail(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        form.querySelector('button[type="submit"]').disabled = false;
      }

      layer.addEventListener('click', (e) => {
        const fill = e.target.closest('[data-fill]');
        if (fill) {
          cardInput.value = fill.dataset.fill.replace(/(\d{4})(?=\d)/g, '$1 ');
          const next = new Date();
          expInput.value = '12 / ' + String((next.getFullYear() + 3) % 100).padStart(2, '0');
          form.cvc.value = '123';
          form.zip.value = '76063';
        }
        if (e.target.closest('[data-pay="cancel"]')) {
          close();
          reject(new Error('cancelled'));
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const digits = cardInput.value.replace(/\D/g, '');
        const problem = cardError(digits, expInput.value, form.cvc.value.trim());
        if (problem) return fail(problem);
        if (!EMAIL_RE.test(form.email.value.trim())) return fail('Enter an email for the receipt.');

        const card = TEST_CARDS[digits];
        const submit = form.querySelector('button[type="submit"]');
        submit.disabled = true;
        submit.textContent = 'Processing…';

        setTimeout(() => {
          submit.textContent = `Pay ${Demo.money(amount)}`;
          if (!card) return fail('Your card was declined. This demo runs in test mode, so real cards are refused. Use a test card below.');
          if (card.result === 'declined') return fail('Your card was declined. Try a different card.');
          if (card.result === 'funds') return fail('Your card has insufficient funds.');

          const payment = {
            id: Demo.uid('pi_test'),
            brand: card.brand,
            last4: digits.slice(-4),
            amount,
            email: form.email.value.trim().toLowerCase(),
          };
          if (card.result === 'auth') return confirmWithBank(payment);
          close();
          resolve(payment);
        }, 700);
      });

      function confirmWithBank(payment) {
        form.innerHTML = `
          <div class="dm-pay-mode">Test mode · bank check</div>
          <h3>Confirm this payment</h3>
          <p class="dm-muted">Your bank asks you to approve ${Demo.money(payment.amount)}. In real life this is a text code or a tap in your banking app.</p>
          <button class="dm-btn" type="button" data-bank="ok">Approve payment</button>
          <button class="dm-link" type="button" data-bank="no">Fail the check</button>`;
        form.addEventListener('click', (e) => {
          const choice = e.target.closest('[data-bank]')?.dataset.bank;
          if (!choice) return;
          close();
          if (choice === 'ok') resolve(payment);
          else reject(new Error('Your bank did not approve the payment.'));
        });
      }
    });
  };

  // ---------------------------------------------------------------------------
  // Small UI helpers

  Demo.toast = function (pane, message) {
    let stack = pane.querySelector(':scope > .dm-toasts');
    if (!stack) {
      stack = document.createElement('div');
      stack.className = 'dm-toasts';
      stack.setAttribute('role', 'status');
      pane.appendChild(stack);
    }
    const el = document.createElement('div');
    el.className = 'dm-toast';
    el.textContent = message;
    stack.appendChild(el);
    while (stack.children.length > 3) stack.firstElementChild.remove();
    setTimeout(() => el.classList.add('is-out'), 2600);
    setTimeout(() => el.remove(), 3000);
  };

  // Clicks on [data-act="name"] call handlers[name](element, event).
  Demo.delegate = function (root, handlers, type = 'click') {
    root.addEventListener(type, (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || !root.contains(el)) return;
      const fn = handlers[el.dataset.act];
      if (fn) fn(el, e);
    });
  };

  // ---------------------------------------------------------------------------
  // Split-screen frame
  //
  // Wide screens: customer view on the left, owner view on the right.
  // Phones: one view at a time with a switch, and a badge when the other side
  // has news.

  Demo.mountFrame = function ({ name, product, store, steps, ownerLabel = 'Owner view', ownerNote = 'the business login' }) {
    const hubHref = document.body.dataset.hub || 'index.html';
    // Single-file builds keep their styles in <body>; keep them when the
    // frame replaces the body's content.
    document.querySelectorAll('body style, body link[rel="stylesheet"]').forEach((el) => document.head.appendChild(el));
    document.body.classList.add('dm-body');
    document.body.innerHTML = `
      <header class="dm-bar">
        <div class="dm-id">
          <a class="dm-back" href="${hubHref}">All demos</a>
          <div>
            <h1>${Demo.esc(product)}</h1>
            <p>${Demo.esc(name)} · sample project, made-up business</p>
          </div>
        </div>
        <nav class="dm-views" aria-label="Choose a view">
          <button type="button" data-view="customer">Customer<span class="dm-badge" data-badge="customer" hidden></span></button>
          <button type="button" data-view="both" class="dm-wide-only">Side by side</button>
          <button type="button" data-view="owner">${Demo.esc(ownerLabel.replace(' view', ''))}<span class="dm-badge" data-badge="owner" hidden></span></button>
        </nav>
        <div class="dm-tools">
          <button type="button" class="dm-tool" data-tool="guide" aria-expanded="false"><span class="dm-long">How to test</span><span class="dm-short">Guide</span></button>
          <button type="button" class="dm-tool" data-tool="reset">Reset</button>
        </div>
        <ol class="dm-guide" hidden>${steps.map((s) => `<li>${Demo.esc(s)}</li>`).join('')}</ol>
      </header>
      <main class="dm-split">
        <section class="dm-pane" data-pane="customer" aria-label="Customer view">
          <div class="dm-plabel"><span class="dm-live"></span>Customer view <small>what visitors see</small></div>
          <div class="dm-scroll"><div class="dm-app" id="customer"></div></div>
        </section>
        <section class="dm-pane" data-pane="owner" aria-label="${Demo.esc(ownerLabel)}">
          <div class="dm-plabel"><span class="dm-live"></span>${Demo.esc(ownerLabel)} <small>${Demo.esc(ownerNote)}</small></div>
          <div class="dm-scroll"><div class="dm-app" id="owner"></div></div>
        </section>
      </main>`;

    const split = document.querySelector('.dm-split');
    const narrow = window.matchMedia('(max-width: 860px)');
    let view = narrow.matches ? 'customer' : 'both';
    try {
      view = sessionStorage.getItem('dm-view:' + product) || view;
    } catch {}

    function applyView() {
      if (narrow.matches && view === 'both') view = 'customer';
      split.dataset.view = view;
      document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
      const badge = document.querySelector(`[data-badge="${view}"]`);
      if (badge) {
        badge.hidden = true;
        badge.textContent = '';
      }
    }
    narrow.addEventListener('change', () => {
      if (!narrow.matches) view = 'both';
      applyView();
    });

    document.querySelector('.dm-views').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-view]');
      if (!btn) return;
      view = btn.dataset.view;
      try {
        sessionStorage.setItem('dm-view:' + product, view);
      } catch {}
      applyView();
    });

    const guide = document.querySelector('.dm-guide');
    const guideBtn = document.querySelector('[data-tool="guide"]');
    const resetBtn = document.querySelector('[data-tool="reset"]');
    let resetArmed = null;

    document.querySelector('.dm-tools').addEventListener('click', (e) => {
      const tool = e.target.closest('[data-tool]')?.dataset.tool;
      if (tool === 'guide') {
        guide.hidden = !guide.hidden;
        guideBtn.setAttribute('aria-expanded', String(!guide.hidden));
      }
      if (tool === 'reset') {
        if (!resetArmed) {
          resetBtn.textContent = 'Tap again';
          resetArmed = setTimeout(() => {
            resetBtn.textContent = 'Reset';
            resetArmed = null;
          }, 3000);
          return;
        }
        clearTimeout(resetArmed);
        resetArmed = null;
        resetBtn.textContent = 'Reset';
        store.reset();
      }
    });

    // When one side changes something, light up the other side.
    store.on((event) => {
      if (!event.note || (event.by !== 'customer' && event.by !== 'owner')) return;
      const other = event.by === 'customer' ? 'owner' : 'customer';
      const pane = document.querySelector(`[data-pane="${other}"]`);
      pane.classList.remove('is-pinged');
      void pane.offsetWidth;
      pane.classList.add('is-pinged');
      Demo.toast(pane, event.note);
      if (split.dataset.view === event.by) {
        const badge = document.querySelector(`[data-badge="${other}"]`);
        badge.textContent = String(Number(badge.textContent || 0) + 1);
        badge.hidden = false;
      }
    });

    applyView();
    return {
      customer: document.getElementById('customer'),
      owner: document.getElementById('owner'),
      customerPane: document.querySelector('[data-pane="customer"]'),
      ownerPane: document.querySelector('[data-pane="owner"]'),
    };
  };

  window.Demo = Demo;
})();

        <p class="tw-job-co">${esc(c.name)} · ${esc(j.city)}</p>
        <h3>${esc(j.title)}</h3>
        <p class="tw-job-meta"><em>${pay(j)}</em><span>${esc(j.type)}</span><span>${esc(j.category)}</span><span>${posted(j.createdAt)}</span></p>
        <p>${esc(j.summary)}</p>
        <p class="tw-about"><b>About ${esc(c.name)}.</b> ${esc(c.about)}</p>
        ${action}
      </div>`;
  }

  function renderPanel() {
    let el = frame.customerPane.querySelector('.tw-panel');
    if (!openJob) return el?.remove();
    if (!el) {
      el = document.createElement('aside');
      el.className = 'tw-panel';
      frame.customerPane.appendChild(el);
      Demo.delegate(el, actions);
      el.addEventListener('submit', submitApplication);
    }
    el.innerHTML = jobPanelHtml();
    const authSlot = el.querySelector('[data-slot="panel-auth"]');
    if (authSlot)
      Demo.mountAuthForm(authSlot, auth, { intro: 'Create a free account to apply and track your application.', onDone: renderCustomer });
  }

  function submitApplication(e) {
    const form = e.target;
    if (form.dataset.form !== 'apply') return;
    e.preventDefault();
    const err = form.querySelector('[data-slot="apply-err"]');
    const fail = (msg) => {
      err.textContent = msg;
      err.hidden = false;
    };
    const file = form.resume.files[0];
    const name = form.name.value.trim();
    const answer = form.answer.value.trim();
    if (!name) return fail('Add your name.');
    if (!file) return fail('Attach your resume.');
    if (!/\.(pdf|docx?)$/i.test(file.name)) return fail('Resumes need to be a PDF or Word file.');
    if (file.size > 5 * 1024 * 1024) return fail('That file is over 5 MB. Try a smaller PDF.');
    if (!answer) return fail('Answer the employer’s question.');

    const user = auth.current();
    const job = store.find('jobs', openJob);
    if (!job.open) return fail('The employer just closed this job.');
    store.insert(
      'applications',
      {
        jobId: job.id,
        name,
        email: user.email,
        phone: form.phone.value.trim(),
        resume: { name: file.name, size: file.size },
        answer,
        note: form.note.value.trim(),
        stage: 'applied',
        interview: '',
      },
      { by: 'customer', note: `New applicant: ${name} for ${job.title}` },
    );
    Demo.sendEmail(store, {
      to: user.email,
      subject: `You applied: ${job.title}`,
      lines: [
        `Hi ${name.split(' ')[0]}, ${company(job.companyId).name} got your application.`,
        'We will email you when they look at it. Track it any time under My applications.',
      ],
    });
    applying = false;
    renderPanel();
    Demo.toast(frame.customerPane, 'Application sent');
  }

  const actions = {
    tab(el) {
      tab = el.dataset.tab;
      openCompany = null;
      renderBody();
    },
    job(el) {
      openJob = el.dataset.id;
      applying = false;
      renderPanel();
    },
    close() {
      openJob = null;
      applying = false;
      renderPanel();
    },
    apply() {
      applying = true;
      renderPanel();
    },
    save(el) {
      const saved = store.list('saved');
      const i = saved.indexOf(el.dataset.id);
      if (i >= 0) saved.splice(i, 1);
      else saved.push(el.dataset.id);
      store.touch();
    },
    category(el) {
      filters.category = el.dataset.cat;
      renderBody();
    },
    company(el) {
      openCompany = el.dataset.id || null;
      renderBody();
    },
    signout() {
      auth.signOut();
    },
  };
  Demo.delegate(C, actions);

  C.addEventListener('change', (e) => {
    const f = e.target.dataset.filter;
    if (f === 'type') e.target.checked ? filters.types.add(e.target.value) : filters.types.delete(e.target.value);
    if (f === 'pay') filters.minPay = Number(e.target.value);
    if (e.target.id === 'tw-city') filters.city = e.target.value;
    if (f || e.target.id === 'tw-city') {
      tab = 'jobs';
      renderBody();
    }
  });
  C.querySelector('#tw-q').addEventListener('input', (e) => {
    filters.q = e.target.value;
    tab = 'jobs';
    renderBody();
  });
  C.querySelector('[data-form="search"]').addEventListener('submit', (e) => e.preventDefault());

  function renderCustomer() {
    const signingIn = !auth.current() && (tab === 'mine' || (openJob && applying));
    if (!signingIn) {
      renderBody();
      // A half-filled application is never redrawn out from under the user.
      if (openJob && !frame.customerPane.querySelector('.tw-form')) renderPanel();
    } else {
      renderNav();
    }
  }

  // ===========================================================================
  // Employer view

  const O = frame.owner;
  let ownerJob = 'all';
  let posting = false;
  let expanded = null;

  function renderOwner() {
    const box = O.closest('.dm-scroll');
    const keep = box.scrollTop;
    const mine = store.list('jobs').filter((j) => j.companyId === EMPLOYER);
    const apps = store.list('applications').filter((a) => mine.some((j) => j.id === a.jobId));
    const shown = ownerJob === 'all' ? apps : apps.filter((a) => a.jobId === ownerJob);
    const fresh = apps.filter((a) => a.stage === 'applied').length;
    O.innerHTML = `
      <div class="two">
        <header class="two-head"><div><span class="tw-mark">Q</span><div><b>Quarry Hill Mechanical</b><span>Hiring dashboard</span></div></div>
          <button type="button" class="two-btn is-go" data-act="post">${posting ? 'Cancel' : 'Post a job'}</button></header>
        ${posting ? postForm() : ''}
        <div class="two-stats">
          <div><b>${mine.filter((j) => j.open).length}</b><span>Open jobs</span></div>
          <div class="${fresh ? 'is-new' : ''}"><b>${fresh}</b><span>New applicants</span></div>
          <div><b>${apps.filter((a) => a.stage === 'interview').length}</b><span>Interviews set</span></div>
          <div><b>${apps.length}</b><span>Total applicants</span></div>
        </div>
        <section class="two-jobs"><h4>Your jobs</h4><ul>${mine
          .map((j) => {
            const n = apps.filter((a) => a.jobId === j.id).length;
            return `<li class="${j.open ? '' : 'is-closed'}"><button type="button" data-act="ojob" data-id="${j.id}" aria-pressed="${ownerJob === j.id}"><b>${esc(j.title)}</b><span>${n} ${n === 1 ? 'applicant' : 'applicants'} · ${pay(j)}${j.open ? '' : ' · closed'}</span></button>
            <button type="button" class="two-btn" data-act="toggle-job" data-id="${j.id}">${j.open ? 'Close' : 'Reopen'}</button></li>`;
          })
          .join('')}</ul>
          ${ownerJob !== 'all' ? '<button type="button" class="tw-link" data-act="ojob" data-id="all">Show all applicants</button>' : ''}</section>
        <section class="two-board">${STAGES.map((stage) => {
          const col = shown.filter((a) => a.stage === stage);
          return `<div class="two-col"><h4>${STAGE_TEXT[stage]} <span>${col.length}</span></h4>${col.map(applicantCard).join('')}</div>`;
        }).join('')}</section>
        <section class="two-feed"><h4>Live activity</h4><ul>${store
          .list('activity')
          .slice(0, 6)
          .map((a) => `<li><time>${Demo.ago(a.at)}</time>${esc(a.note)}</li>`)
          .join('')}</ul></section>
      </div>`;
    box.scrollTop = keep;
  }

  function applicantCard(a) {
    const j = store.find('jobs', a.jobId);
    const open = expanded === a.id;
    const next =
      { applied: [['reviewing', 'Start review']], reviewing: [['interview', 'Invite to interview']], interview: [['offer', 'Make offer']] }[
        a.stage
      ] || [];
    const interviewPicker =
      a.stage === 'reviewing'
        ? `<label class="two-when">Interview time <select data-when="${a.id}">${[1, 2, 3]
            .flatMap((d) => ['09:00', '13:30'].map((t) => `${Demo.dayKey(Demo.addDays(d))} ${t}`))
            .map((v) => `<option value="${v}">${Demo.niceDay(v.slice(0, 10))} ${Demo.niceTime(v.slice(11))}</option>`)
            .join('')}</select></label>`
        : '';
    return `
      <article class="two-app${Date.now() - a.createdAt < 600e3 ? ' is-fresh' : ''}">
        <button type="button" class="two-app-top" data-act="expand" data-id="${a.id}" aria-expanded="${open}"><b>${esc(a.name)}</b><span>${esc(j.title)} · ${Demo.ago(a.createdAt)}</span></button>
        ${
          open
            ? `<dl><dt>Email</dt><dd>${esc(a.email)}</dd>${a.phone ? `<dt>Phone</dt><dd>${esc(a.phone)}</dd>` : ''}
          <dt>Resume</dt><dd>${esc(a.resume.name)} (${Math.max(1, Math.round(a.resume.size / 1024))} KB)</dd>
          <dt>${esc(j.question)}</dt><dd>${esc(a.answer)}</dd>${a.note ? `<dt>Note</dt><dd>${esc(a.note)}</dd>` : ''}
          ${a.interview ? `<dt>Interview</dt><dd>${Demo.niceDay(a.interview.slice(0, 10))} ${Demo.niceTime(a.interview.slice(11))}</dd>` : ''}</dl>`
            : ''
        }
        ${interviewPicker}
        ${a.stage === 'offer' || a.stage === 'declined' ? '' : `<div class="two-app-acts">${next.map(([to, label]) => `<button type="button" class="two-btn is-go" data-act="stage" data-id="${a.id}" data-to="${to}">${label}</button>`).join('')}<button type="button" class="two-btn" data-act="stage" data-id="${a.id}" data-to="declined">Decline</button></div>`}
      </article>`;
  }

  function postForm() {
    return `
      <form class="two-post" data-form="post" novalidate>
        <div class="two-wide"><label for="two-title">Job title</label><input id="two-title" name="title" maxlength="60" required placeholder="Install Technician"></div>
        <div><label for="two-type">Type</label><select id="two-type" name="type">${TYPES.map((t) => `<option>${t}</option>`).join('')}</select></div>
        <div><label for="two-cat">Category</label><select id="two-cat" name="category">${CATEGORIES.map((c) => `<option>${c}</option>`).join('')}</select></div>
        <div><label for="two-low">Pay from ($/hr)</label><input id="two-low" name="payLow" type="number" min="7" max="200" required></div>
        <div><label for="two-high">Pay to ($/hr)</label><input id="two-high" name="payHigh" type="number" min="7" max="200" required></div>
        <div class="two-wide"><label for="two-sum">What the job is</label><textarea id="two-sum" name="summary" rows="2" maxlength="240" required></textarea></div>
        <div class="two-wide"><label for="two-q">One question for applicants</label><input id="two-q" name="question" maxlength="120" required placeholder="Do you have your own tools?"></div>
        <p class="dm-err two-wide" data-slot="post-err" hidden></p>
        <button type="submit" class="two-btn is-go">Publish job</button>
      </form>`;
  }

  function emailApplicant(a, subject, line) {
    Demo.sendEmail(store, {
      to: a.email,
      subject,
      lines: [`Hi ${a.name.split(' ')[0]},`, line, 'Quarry Hill Mechanical, via Tarrant Works'],
    });
  }

  const ownerActions = {
    post() {
      posting = !posting;
      renderOwner();
    },
    ojob(el) {
      ownerJob = el.dataset.id;
      renderOwner();
    },
    expand(el) {
      expanded = expanded === el.dataset.id ? null : el.dataset.id;
      renderOwner();
    },
    'toggle-job'(el) {
      const j = store.find('jobs', el.dataset.id);
      store.update('jobs', j.id, { open: !j.open }, { by: 'owner', note: `${j.open ? 'Closed' : 'Reopened'} ${j.title}` });
    },
    stage(el) {
      const a = store.find('applications', el.dataset.id);
      const j = store.find('jobs', a.jobId);
      const to = el.dataset.to;
      const patch = { stage: to };
      if (to === 'reviewing') emailApplicant(a, `Update on ${j.title}`, 'The hiring team is looking at your application now.');
      if (to === 'interview') {
        patch.interview = O.querySelector(`[data-when="${a.id}"]`)?.value || `${Demo.dayKey(Demo.addDays(2))} 09:00`;
        emailApplicant(
          a,
          `Interview invite: ${j.title}`,
          `Can you come in ${Demo.niceDay(patch.interview.slice(0, 10), { weekday: 'long', month: 'short', day: 'numeric' })} at ${Demo.niceTime(patch.interview.slice(11))}? We are at our Arlington shop.`,
        );
      }
      if (to === 'offer')
        emailApplicant(a, `Job offer: ${j.title}`, `We'd like to offer you the job at ${pay(j)}. Reply to talk through a start date.`);
      if (to === 'declined')
        emailApplicant(
          a,
          `About your application for ${j.title}`,
          'Thanks for applying. We went with another candidate this time and will keep your resume on file.',
        );
      store.update('applications', a.id, patch, { by: 'owner', note: `${a.name}: ${STAGE_TEXT[to].toLowerCase()}` });
    },
  };

  O.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (el && ownerActions[el.dataset.act]) ownerActions[el.dataset.act](el);
  });
  O.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const err = O.querySelector('[data-slot="post-err"]');
    const low = Number(data.payLow);
    const high = Number(data.payHigh);
    const problem = !data.title.trim()
      ? 'Add a job title.'
      : !low || !high
        ? 'Add the pay range. Tarrant Works lists pay on every job.'
        : low > high
          ? 'The first pay number should be the lower one.'
          : !data.summary.trim() || !data.question.trim()
            ? 'Describe the job and add one question.'
            : '';
    if (problem) {
      err.textContent = problem;
      err.hidden = false;
      return;
    }
    posting = false;
    store.insert(
      'jobs',
      {
        companyId: EMPLOYER,
        title: data.title.trim(),
        type: data.type,
        category: data.category,
        city: 'Arlington',
        payLow: low,
        payHigh: high,
        summary: data.summary.trim(),
        question: data.question.trim(),
        open: true,
      },
      { by: 'owner', note: `Posted ${data.title.trim()}` },
    );
  });

  store.on((event) => {
    if (event.action === 'reset') {
      openJob = null;
      applying = false;
      tab = 'jobs';
      renderPanel();
    }
    renderCustomer();
    renderOwner();
  });

  renderBody();
  renderOwner();
})();

</script>
</body>
</html>
