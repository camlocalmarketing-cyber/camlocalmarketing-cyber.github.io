/* Split-screen frame and shared widgets (sign-in, checkout, email, toasts).
   Layout: a slim top bar, then two independently scrolling panes. */

:root {
  --frame-bg: #e9ebee;
  --frame-bar: #ffffff;
  --frame-ink: #1b2027;
  --frame-muted: #5d6673;
  --frame-line: #d5d9df;
  --frame-accent: #1f6feb;
  --frame-ping: #f2b705;
  --frame-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --frame-bg: #0f1216;
    --frame-bar: #171b21;
    --frame-ink: #e7eaee;
    --frame-muted: #9aa3ae;
    --frame-line: #2a3039;
    --frame-accent: #5b9dff;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --frame-bg: #0f1216;
  --frame-bar: #171b21;
  --frame-ink: #e7eaee;
  --frame-muted: #9aa3ae;
  --frame-line: #2a3039;
  --frame-accent: #5b9dff;
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}
html,
body.dm-body {
  height: 100%;
}
body.dm-body {
  margin: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--frame-bg);
  color: var(--frame-ink);
  font-family: var(--frame-ui);
  overflow: hidden;
}
body.dm-body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--frame-bar);
}

.dm-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--frame-bar);
  border-bottom: 1px solid var(--frame-line);
  z-index: 5;
}
.dm-id {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  flex: 1 1 260px;
}
.dm-id h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.dm-id p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--frame-muted);
}
.dm-back {
  flex: none;
  font-size: 12px;
  color: var(--frame-muted);
  text-decoration: none;
  padding: 6px 10px;
  border: 1px solid var(--frame-line);
  border-radius: 6px;
}
.dm-back:hover {
  color: var(--frame-ink);
}

.dm-views {
  display: flex;
  padding: 3px;
  border-radius: 8px;
  background: var(--frame-bg);
  border: 1px solid var(--frame-line);
}
.dm-views button,
.dm-tool {
  font: 500 13px/1 var(--frame-ui);
  color: var(--frame-muted);
  background: none;
  border: 0;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.dm-views button[aria-pressed='true'] {
  background: var(--frame-bar);
  color: var(--frame-ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
.dm-tools {
  display: flex;
  gap: 6px;
}
.dm-tool[data-tool='reset'] {
  min-width: 5.5em;
  justify-content: center;
}
.dm-tool {
  border: 1px solid var(--frame-line);
}
.dm-tool:hover,
.dm-views button:hover {
  color: var(--frame-ink);
}
.dm-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--frame-ping);
  color: #1b1600;
  font-size: 11px;
  font-weight: 700;
  display: inline-grid;
  place-items: center;
}
.dm-guide {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(100% + 6px);
  width: min(420px, calc(100vw - 32px));
  margin: 0;
  padding: 16px 18px 16px 36px;
  background: var(--frame-bar);
  color: var(--frame-ink);
  border: 1px solid var(--frame-line);
  border-radius: 10px;
  box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.35);
  font-size: 14px;
  line-height: 1.5;
  display: grid;
  gap: 8px;
}

.dm-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--frame-line);
  min-height: 0;
}
.dm-split[data-view='customer'],
.dm-split[data-view='owner'] {
  grid-template-columns: 1fr;
}
.dm-split[data-view='customer'] [data-pane='owner'],
.dm-split[data-view='owner'] [data-pane='customer'] {
  display: none;
}

.dm-pane {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--frame-bg);
}
.dm-plabel {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px max(16px, env(safe-area-inset-left, 0px));
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--frame-ink);
  background: var(--frame-bar);
  border-bottom: 1px solid var(--frame-line);
}
.dm-plabel small {
  font-weight: 400;
  color: var(--frame-muted);
}
.dm-live {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #2ea36a;
  box-shadow: 0 0 0 3px rgba(46, 163, 106, 0.18);
}
.dm-pane.is-pinged .dm-plabel {
  animation: dm-ping 1.4s ease-out;
}
@keyframes dm-ping {
  0% {
    background: var(--frame-ping);
  }
  100% {
    background: var(--frame-bar);
  }
}
.dm-scroll {
  display: grid;
  overflow: auto;
  min-height: 0;
  overscroll-behavior: contain;
}
.dm-app {
  display: grid;
  align-content: stretch;
  container-type: inline-size;
}
.dm-app > * {
  min-width: 0;
  align-self: start;
}

.dm-short {
  display: none;
}
@media (max-width: 860px) {
  .dm-wide-only {
    display: none !important;
  }
  .dm-long {
    display: none;
  }
  .dm-short {
    display: inline;
  }
  .dm-bar {
    gap: 8px;
  }
  .dm-id {
    flex-basis: 100%;
  }
  .dm-views {
    flex: 1;
  }
  .dm-views button {
    flex: 1;
    justify-content: center;
  }
}
@media (max-width: 420px) {
  .dm-tool {
    padding: 8px;
    font-size: 12px;
  }
  .dm-id p {
    display: none;
  }
}

/* ---- Shared widgets. Each demo sets the --dm-* colors on .dm-app. ---- */

.dm-app {
  --dm-accent: #1f6feb;
  --dm-on-accent: #fff;
  --dm-ink: #1b2027;
  --dm-muted: #5d6673;
  --dm-surface: #fff;
  --dm-line: #d5d9df;
  --dm-radius: 8px;
}
.dm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 20px;
  font: inherit;
  font-weight: 650;
  color: var(--dm-on-accent);
  background: var(--dm-accent);
  border: 0;
  border-radius: var(--dm-radius);
  cursor: pointer;
}
.dm-btn:disabled {
  opacity: 0.6;
  cursor: progress;
}
.dm-link {
  font: inherit;
  color: var(--dm-accent);
  background: none;
  border: 0;
  padding: 8px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dm-muted {
  color: var(--dm-muted);
}
.dm-hint {
  margin: -4px 0 0;
  font-size: 13px;
  color: var(--dm-muted);
}
.dm-err {
  margin: 0;
  padding: 10px 12px;
  border-radius: 6px;
  background: #fdecea;
  color: #8a1f11;
  font-size: 14px;
}

.dm-auth,
.dm-pay {
  display: grid;
  gap: 10px;
}
.dm-auth h3,
.dm-pay h3 {
  margin: 0;
}
.dm-auth label,
.dm-pay label {
  font-size: 13px;
  font-weight: 600;
  color: var(--dm-ink);
}
.dm-auth input,
.dm-pay input {
  width: 100%;
  box-sizing: border-box;
  min-height: 44px;
  padding: 0 12px;
  font: inherit;
  color: var(--dm-ink);
  background: var(--dm-surface);
  border: 1px solid var(--dm-line);
  border-radius: calc(var(--dm-radius) * 0.75);
}
.dm-auth input:focus,
.dm-pay input:focus,
.dm-btn:focus-visible,
.dm-link:focus-visible {
  outline: 2px solid var(--dm-accent);
  outline-offset: 2px;
}
.dm-seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--dm-line);
  border-radius: var(--dm-radius);
  overflow: hidden;
}
.dm-seg button {
  font: inherit;
  font-size: 14px;
  padding: 10px;
  border: 0;
  background: none;
  color: var(--dm-muted);
  cursor: pointer;
}
.dm-seg button[aria-selected='true'] {
  background: var(--dm-ink);
  color: var(--dm-surface);
}

.dm-layer {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(10, 12, 16, 0.55);
  overflow: auto;
}
.dm-pay {
  width: min(420px, 100%);
  box-sizing: border-box;
  padding: 22px;
  border-radius: 12px;
  background: #fff;
  color: #1a1f36;
  font-family: var(--frame-ui);
  font-size: 15px;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
  --dm-accent: #635bff;
  --dm-on-accent: #fff;
  --dm-ink: #1a1f36;
  --dm-muted: #5e6479;
  --dm-surface: #fff;
  --dm-line: #d8dbe4;
  --dm-radius: 8px;
}
.dm-pay-mode {
  justify-self: start;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8a4b00;
  background: #ffe7c2;
  padding: 4px 8px;
  border-radius: 4px;
}
.dm-pay-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 8px;
}
.dm-pay-row > div {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.dm-pay-cards {
  font-size: 13px;
  color: #5e6479;
  border-top: 1px solid #e6e8ee;
  padding-top: 10px;
}
.dm-pay-cards summary {
  cursor: pointer;
  font-weight: 600;
  color: #1a1f36;
}
.dm-pay-cards ul {
  list-style: none;
  margin: 8px 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.dm-pay-cards button {
  font:
    12px ui-monospace,
    Menlo,
    Consolas,
    monospace;
  padding: 4px 6px;
  border: 1px solid #d8dbe4;
  border-radius: 4px;
  background: #f6f8fa;
  cursor: pointer;
  color: #1a1f36;
}

.dm-mail {
  padding: 16px 18px;
  border: 1px solid var(--dm-line);
  border-radius: var(--dm-radius);
  background: var(--dm-surface);
  color: var(--dm-ink);
  font-size: 14px;
  line-height: 1.5;
}
.dm-mail header {
  border-bottom: 1px solid var(--dm-line);
  margin-bottom: 10px;
  padding-bottom: 8px;
}
.dm-mail h4 {
  margin: 6px 0 0;
  font-size: 15px;
}
.dm-mail p {
  margin: 0 0 8px;
}
.dm-mail-from {
  font-weight: 650;
}
.dm-mail-from span,
.dm-mail-to {
  font-size: 12px;
  color: var(--dm-muted);
  font-weight: 400;
}
.dm-mail-code {
  font:
    700 26px/1 ui-monospace,
    Menlo,
    Consolas,
    monospace;
  letter-spacing: 0.3em;
  padding: 12px 0 4px;
  user-select: all;
}

.dm-toasts {
  position: absolute;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  display: grid;
  justify-items: center;
  gap: 8px;
  pointer-events: none;
}
.dm-toast {
  padding: 10px 16px;
  border-radius: 8px;
  background: #1b2027;
  color: #fff;
  font: 500 14px/1.35 var(--frame-ui);
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
  transition:
    opacity 0.3s,
    transform 0.3s;
}
.dm-toast.is-out {
  opacity: 0;
  transform: translateY(8px);
}

@media (prefers-reduced-motion: reduce) {
  .dm-pane.is-pinged .dm-plabel {
    animation: none;
  }
  .dm-toast {
    transition: none;
  }
}

/* Juniper Street Kitchen. Brand colors come from the existing sample site:
   cream paper, terracotta, olive, warm ink. The owner side uses the same
   palette in a denser, ticket-rail layout. */

#customer,
#owner,
.jk-panel {
  --cream: #f7efe3;
  --paper: #fffaf2;
  --terra: #b8502f;
  --terra-dark: #8f3a1f;
  --olive: #5c6b3a;
  --ink: #2a1d15;
  --muted: #7a6656;
  --line: #e7d9c6;
  --display: 'Playfair Display', Georgia, serif;
  --body: 'DM Sans', system-ui, sans-serif;
  --dm-accent: var(--terra);
  --dm-ink: var(--ink);
  --dm-muted: var(--muted);
  --dm-surface: var(--paper);
  --dm-line: var(--line);
  --dm-radius: 4px;
  font-family: var(--body);
  color: var(--ink);
  background: var(--cream);
  line-height: 1.55;
  font-size: 15px;
}
#owner {
  background: #f3ece1;
}

.jk h2,
.jk h3,
.jk h4,
.jk-panel h3 {
  font-family: var(--display);
  font-weight: 500;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
.jk-sample {
  margin: 0;
  padding: 7px 16px;
  font-size: 12px;
  text-align: center;
  background: var(--ink);
  color: #f3e6d3;
}

.jk-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 20px;
  background: rgba(247, 239, 227, 0.95);
  border-bottom: 1px solid var(--line);
}
.jk-brand {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 700;
  color: var(--terra-dark);
  text-decoration: none;
  line-height: 1;
}
.jk-brand small {
  display: block;
  margin-top: 4px;
  font: 500 10px/1 var(--body);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}
.jk-nav {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 14px;
  flex-wrap: wrap;
}
.jk-nav a {
  color: var(--muted);
  text-decoration: none;
}
.jk-nav a:hover {
  color: var(--terra);
}
.jk-pill {
  font: 600 13px/1 var(--body);
  padding: 9px 13px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  background: none;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  gap: 6px;
}
.jk-pill span:not(:empty) {
  background: var(--terra);
  color: #fff;
  border-radius: 9px;
  padding: 1px 6px;
  font-size: 11px;
}
.jk-pill-dark {
  background: var(--ink);
  color: var(--cream);
}

.jk-hero {
  padding: 44px 20px 34px;
  border-bottom: 1px solid var(--line);
}
.jk-eyebrow {
  margin: 0 0 10px;
  font-size: 11px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--olive);
  font-weight: 700;
}
.jk-hero h2 {
  font-size: clamp(34px, 8cqi, 60px);
}
.jk-hero h2 em {
  color: var(--terra);
}
.jk-hero p {
  max-width: 46ch;
  color: var(--muted);
  margin: 14px 0 0;
}
.jk-open {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}
.jk-open::before {
  content: '';
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #9ca3af;
}
.jk-open.is-open::before {
  background: #22a35a;
  box-shadow: 0 0 0 4px rgba(34, 163, 90, 0.18);
}

.jk-book {
  display: grid;
  gap: 22px;
  padding: 34px 20px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.jk-book-copy h3 {
  font-size: 30px;
}
.jk-book-copy p {
  color: var(--muted);
  margin: 8px 0 0;
  max-width: 40ch;
}
.jk-book-form {
  display: grid;
  gap: 8px;
}
.jk-book-form label,
.jk-label,
.jk-panel label {
  font-size: 13px;
  font-weight: 700;
  margin-top: 6px;
}
.jk select,
.jk textarea,
.jk-panel select,
.jk-panel input:not([type='checkbox']) {
  font: inherit;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  min-height: 44px;
  box-sizing: border-box;
  width: 100%;
}
.jk-days,
.jk-times {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.jk-days button,
.jk-times button {
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 4px;
  padding: 8px 12px;
  min-height: 44px;
  display: grid;
  justify-items: center;
  line-height: 1.2;
}
.jk-days button span {
  font-size: 12px;
  color: var(--muted);
}
.jk-days button[aria-pressed='true'],
.jk-times button[aria-pressed='true'] {
  background: var(--ink);
  color: var(--cream);
  border-color: var(--ink);
}
.jk-days button[aria-pressed='true'] span {
  color: #d9c7b1;
}
.jk-times button:disabled {
  color: #b8a898;
  background: transparent;
  text-decoration: line-through;
  cursor: not-allowed;
}
.jk-times button small {
  font-size: 10px;
  text-decoration: none;
}
.jk-book-form .dm-btn {
  justify-self: start;
  margin-top: 8px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 13px;
}
.jk-book-auth {
  border: 1px solid var(--line);
  background: #fff;
  padding: 18px;
  border-radius: 4px;
}

.jk-menu {
  padding: 34px 20px 90px;
}
.jk-menu-head h3 {
  font-size: 30px;
}
.jk-menu-head p {
  color: var(--muted);
  margin: 8px 0 18px;
}
.jk-cat {
  margin-top: 22px;
}
.jk-cat h4 {
  font-size: 20px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--ink);
}
.jk-cat ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.jk-cat li {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 6px 14px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px dashed var(--line);
}
.jk-cat li > div {
  min-width: 0;
}
.jk-cat li p {
  margin: 2px 0 0;
  font-size: 14px;
  color: var(--muted);
}
.jk-cat li.is-out {
  opacity: 0.55;
}
.jk-tag {
  margin-left: 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--olive);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.jk-price {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.jk-add {
  font: 700 13px/1 var(--body);
  padding: 10px 14px;
  min-height: 40px;
  border-radius: 4px;
  border: 1.5px solid var(--terra);
  background: #fff;
  color: var(--terra-dark);
  cursor: pointer;
  white-space: nowrap;
}
.jk-add:hover:not(:disabled) {
  background: var(--terra);
  color: #fff;
}
.jk-add:disabled {
  border-color: var(--line);
  color: var(--muted);
  cursor: not-allowed;
}
.jk-soldout {
  font-size: 12px;
  font-weight: 700;
  color: var(--terra-dark);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.jk-foot {
  padding: 20px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
}
.jk-cartbar {
  position: sticky;
  bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--ink);
  color: var(--cream);
  font-weight: 600;
}

@container (min-width: 620px) {
  .jk-book {
    grid-template-columns: 1fr 1.5fr;
  }
  .jk-book-auth {
    grid-column: 2;
  }
  .jk-menu > div:last-child {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 34px;
  }
}
@container (max-width: 380px) {
  .jk-cat li {
    grid-template-columns: 1fr auto;
  }
  .jk-cat li .jk-add,
  .jk-cat li .jk-soldout {
    grid-column: 1 / -1;
    justify-self: start;
  }
}

/* Slide-over panel for cart, account and inbox */
.jk-panel {
  position: absolute;
  inset: 33px 0 0 auto;
  z-index: 20;
  width: min(420px, 100%);
  background: var(--paper);
  border-left: 1px solid var(--line);
  box-shadow: -20px 0 40px -24px rgba(42, 29, 21, 0.45);
  overflow: auto;
  overscroll-behavior: contain;
}
.jk-panel-in {
  display: grid;
  gap: 12px;
  padding: 22px 20px 30px;
}
.jk-panel h3 {
  font-size: 26px;
  padding-right: 60px;
}
.jk-panel h4 {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 500;
  margin: 10px 0 0;
}
.jk-close {
  position: absolute;
  right: 14px;
  top: 16px;
  font: 600 13px var(--body);
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 4px;
  padding: 8px 10px;
  cursor: pointer;
  color: var(--ink);
}
.jk-lines,
.jk-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.jk-lines li {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  align-items: center;
}
.jk-qty {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
.jk-qty button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: #fff;
  font: 600 16px/1 var(--body);
  cursor: pointer;
  color: var(--ink);
}
.jk-sum {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px;
  margin: 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.jk-sum dd {
  margin: 0;
  text-align: right;
}
.jk-res,
.jk-order {
  display: grid;
  gap: 6px;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.jk-res div span,
.jk-order div span {
  display: block;
  font-size: 13px;
  color: var(--muted);
}
.jk-res .dm-link {
  justify-self: start;
  padding: 0;
  font-size: 13px;
}
.jk-status {
  justify-self: start;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  background: #efe5d6;
  color: var(--muted);
}
.jk-status.is-requested {
  background: #fbe7c6;
  color: #7a4a00;
}
.jk-status.is-confirmed,
.jk-status.is-seated {
  background: #e1ead0;
  color: #3d4a1f;
}
.jk-status.is-declined,
.jk-status.is-noshow {
  background: #f6dcd3;
  color: var(--terra-dark);
}
.jk-track {
  list-style: none;
  margin: 4px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  font-size: 11px;
  color: var(--muted);
}
.jk-track li {
  border-top: 4px solid var(--line);
  padding-top: 4px;
}
.jk-track li.is-done {
  border-color: var(--olive);
  color: var(--ink);

<body>
<script>
// Shared runtime for the split-screen demos: a small local data store,
// demo email, sign-in, a test-mode card checkout and the split-screen frame.
// Everything runs in the browser. Nothing is sent over the network.

(function () {
  'use strict';

  const Demo = {};

  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  Demo.esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ESCAPES[c]);

  Demo.money = (cents, { round = false } = {}) => {
    const dollars = cents / 100;
    return dollars.toLocaleString('en-US', {
      style: 'currency',
      currency: 'USD',
      maximumFractionDigits: round ? 0 : 2,
      minimumFractionDigits: round ? 0 : 2,
    });
  };

  Demo.uid = (prefix) => {
    const bytes = crypto.getRandomValues(new Uint8Array(5));
    return (
      prefix +
      '_' +
      Array.from(bytes, (b) => b.toString(36).padStart(2, '0'))
        .join('')
        .slice(0, 8)
    );
  };

  Demo.ago = (ts) => {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' hr ago';
    return Math.round(s / 86400) + ' d ago';
  };

  Demo.dayKey = (date) => {
    const d = new Date(date);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  Demo.addDays = (n, from = new Date()) => {
    const d = new Date(from);
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + n);
    return d;
  };

  Demo.fromDayKey = (key) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d, 12);
  };

  Demo.niceDay = (key, opts = { weekday: 'short', month: 'short', day: 'numeric' }) =>
    Demo.fromDayKey(key).toLocaleDateString('en-US', opts);

  Demo.niceTime = (hhmm) => {
    const [h, m] = hhmm.split(':').map(Number);
    const suffix = h >= 12 ? 'pm' : 'am';
    const hour = ((h + 11) % 12) + 1;
    return m ? `${hour}:${String(m).padStart(2, '0')}${suffix}` : `${hour}${suffix}`;
  };

  // ---------------------------------------------------------------------------
  // Store
  //
  // One JSON document per demo, saved to localStorage when the browser allows
  // it. Both views read from the same store, so a change made on one side shows
  // up on the other right away. Other tabs stay in sync through the storage
  // event.

  Demo.createStore = function (key, seed) {
    const listeners = [];
    let state = read() || seed();

    function read() {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function write() {
      try {
        localStorage.setItem(key, JSON.stringify(state));
      } catch {
        // Storage can be blocked (private windows, previews). The demo keeps
        // working in memory for this visit.
      }
    }

    function emit(event) {
      listeners.forEach((fn) => fn(event));
    }

    function commit(event) {
      event.at = Date.now();
      if (event.note) {
        state.activity = state.activity || [];
        state.activity.unshift({ id: Demo.uid('act'), at: event.at, by: event.by, note: event.note });
        state.activity.length = Math.min(state.activity.length, 80);
      }
      write();
      emit(event);
    }

    window.addEventListener('storage', (e) => {
      if (e.key !== key) return;
      const fresh = read();
      if (fresh) {
        state = fresh;
        emit({ action: 'sync' });
      }
    });

    const store = {
      get state() {
        return state;
      },
      list(table) {
        return state[table] || (state[table] = []);
      },
      find(table, id) {
        return store.list(table).find((row) => row.id === id);
      },
      insert(table, row, { by, note } = {}) {
        row.id = row.id || Demo.uid(table.slice(0, 3));
        row.createdAt = row.createdAt || Date.now();
        store.list(table).unshift(row);
        commit({ table, action: 'insert', row, by, note });
        return row;
      },
      update(table, id, patch, { by, note } = {}) {
        const row = store.find(table, id);
        if (!row) return null;
        Object.assign(row, patch, { updatedAt: Date.now() });
        commit({ table, action: 'update', row, by, note });
        return row;
      },
      remove(table, id, { by, note } = {}) {
        state[table] = store.list(table).filter((row) => row.id !== id);
        commit({ table, action: 'remove', id, by, note });
      },
      setting(name, value, { by, note } = {}) {
        state.settings = state.settings || {};
        if (value === undefined) return state.settings[name];
        state.settings[name] = value;
        commit({ table: 'settings', action: 'update', name, by, note });
        return value;
      },
      // Save and notify without changing a table (used for session changes).
      touch({ by, note } = {}) {
        commit({ action: 'touch', by, note });
      },
      on(fn) {
        listeners.push(fn);
      },
      reset() {
        state = seed();
        write();
        emit({ action: 'reset' });
      },
    };

    return store;
  };

  // ---------------------------------------------------------------------------
  // Demo email
  //
  // Messages land in an "outbox" table instead of being sent. The customer
  // view shows the ones addressed to the signed-in visitor as an inbox, and the
  // owner view lists everything the business would have sent.

  Demo.sendEmail = function (store, { to, subject, lines, code, by = 'system' }) {
    return store.insert('outbox', { to: to.toLowerCase(), subject, lines, code: code || null, read: false }, { by });
  };

  Demo.renderEmail = function (mail, brand) {
    const body = mail.lines.map((line) => `<p>${Demo.esc(line)}</p>`).join('');
    const code = mail.code ? `<div class="dm-mail-code">${Demo.esc(mail.code)}</div>` : '';
    return `
      <article class="dm-mail">
        <header>
          <div class="dm-mail-from">${Demo.esc(brand)} <span>&lt;no-reply@sample.test&gt;</span></div>
          <div class="dm-mail-to">To: ${Demo.esc(mail.to)} · ${Demo.ago(mail.createdAt)}</div>
          <h4>${Demo.esc(mail.subject)}</h4>
        </header>
        ${body}${code}
      </article>`;
  };

  // ---------------------------------------------------------------------------
  // Accounts
  //
  // Passwords are hashed with PBKDF2 (Web Crypto) before they are stored.
  // New accounts confirm their email with a six-digit code, and repeated wrong
  // passwords lock sign-in for 30 seconds.

  const PBKDF2_ROUNDS = 120000;
  const LOCK_AFTER = 5;
  const LOCK_MS = 30000;

  const toHex = (buffer) => Array.from(new Uint8Array(buffer), (b) => b.toString(16).padStart(2, '0')).join('');

  async function hashPassword(password, saltHex) {
    const salt = saltHex ? Uint8Array.from(saltHex.match(/../g), (h) => parseInt(h, 16)) : crypto.getRandomValues(new Uint8Array(16));
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: PBKDF2_ROUNDS }, keyMaterial, 256);
    return { salt: toHex(salt), hash: toHex(bits) };
  }

  function sixDigitCode() {
    const n = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;
    return String(n).padStart(6, '0');
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  Demo.createAuth = function (store, { brand }) {
    const failures = {};

    function sendCode(user) {
      const code = sixDigitCode();
      store.update('users', user.id, { code, codeExpires: Date.now() + 10 * 60 * 1000 });
      Demo.sendEmail(store, {
        to: user.email,
        subject: `Your ${brand} confirmation code`,
        lines: [`Hi ${user.name.split(' ')[0]},`, 'Enter this code to confirm your email address. It expires in 10 minutes.'],
        code,
      });
    }

    const auth = {
      current() {
        const session = store.state.session;
        return session ? store.find('users', session.userId) || null : null;
      },

      async signUp({ name, email, password }) {
        name = name.trim();
        email = email.trim().toLowerCase();
        if (name.length < 2) throw new Error('Enter your name.');
        if (!EMAIL_RE.test(email)) throw new Error('Enter a valid email address.');
        if (password.length < 8) throw new Error('Use at least 8 characters for your password.');
        if (store.list('users').some((u) => u.email === email)) throw new Error('That email already has an account. Sign in instead.');
        const { salt, hash } = await hashPassword(password);
        const user = store.insert('users', { name, email, salt, hash, verified: false }, { by: 'customer', note: `New account: ${name}` });
        sendCode(user);
        return user;
      },

      verify(email, code) {
        const user = store.list('users').find((u) => u.email === email.trim().toLowerCase());
        if (!user) throw new Error('We could not find that account.');
        if (!user.code || Date.now() > user.codeExpires) throw new Error('That code has expired. Send a new one.');
        if (code.trim() !== user.code) throw new Error('That code does not match. Check the latest email.');
        store.state.session = { userId: user.id, at: Date.now() };
        store.update('users', user.id, { verified: true, code: null }, { by: 'customer', note: `${user.name} confirmed their email` });
        return user;
      },

      resend(email) {
        const user = store.list('users').find((u) => u.email === email.trim().toLowerCase());
        if (user && !user.verified) sendCode(user);
      },

      async signIn(email, password) {
        email = email.trim().toLowerCase();
        const lock = failures[email];
        if (lock && lock.until > Date.now()) {
          throw new Error(`Too many attempts. Try again in ${Math.ceil((lock.until - Date.now()) / 1000)} seconds.`);
        }
        const user = store.list('users').find((u) => u.email === email);
        const attempt = user ? await hashPassword(password, user.salt) : null;
        if (!user || attempt.hash !== user.hash) {
          const f = (failures[email] = failures[email] || { count: 0, until: 0 });
          f.count += 1;
          if (f.count >= LOCK_AFTER) {
            f.count = 0;
            f.until = Date.now() + LOCK_MS;
          }
          throw new Error('Email or password is incorrect.');
        }
        delete failures[email];
        if (!user.verified) {
          sendCode(user);
          const err = new Error('Confirm your email first. We sent a new code.');
          err.needsCode = true;
          throw err;
        }
        store.state.session = { userId: user.id, at: Date.now() };
        store.touch();
        return user;
      },

      signOut() {
        store.state.session = null;
        store.touch();
      },
    };

    return auth;
  };

  // Sign-in / sign-up / confirm-code card. Calls onDone(user) when signed in.
  Demo.mountAuthForm = function (container, auth, { onDone, intro = 'Sign in or create a free account.' }) {
    // A fresh host element each time, so remounting never stacks listeners.
    const root = document.createElement('div');
    container.replaceChildren(root);
    let mode = 'signin';
    let pendingEmail = '';

    function render(error = '') {
      const err = error ? `<p class="dm-err" role="alert">${Demo.esc(error)}</p>` : '';
      if (mode === 'code') {
        root.innerHTML = `
          <form class="dm-auth" data-form="code" novalidate>
            <h3>Check your email</h3>
            <p class="dm-muted">We sent a six-digit code to <b>${Demo.esc(pendingEmail)}</b>. Open the demo inbox above to see it.</p>
            <label for="dm-code">Confirmation code</label>
            <input id="dm-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
            ${err}
            <button class="dm-btn" type="submit">Confirm email</button>
            <button class="dm-link" type="button" data-auth="resend">Send a new code</button>
          </form>`;
        return;
      }
      const signup = mode === 'signup';
      root.innerHTML = `
        <form class="dm-auth" data-form="${mode}" novalidate>
          <div class="dm-seg" role="tablist">
            <button type="button" role="tab" aria-selected="${!signup}" data-auth="signin">Sign in</button>
            <button type="button" role="tab" aria-selected="${signup}" data-auth="signup">Create account</button>
          </div>
          <p class="dm-muted">${Demo.esc(intro)}</p>
          ${signup ? '<label for="dm-name">Full name</label><input id="dm-name" name="name" autocomplete="name" required>' : ''}
          <label for="dm-email">Email</label>
          <input id="dm-email" name="email" type="email" autocomplete="email" value="${Demo.esc(pendingEmail)}" required>
          <label for="dm-pass">Password</label>
          <input id="dm-pass" name="password" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" minlength="8" required>
          ${signup ? '<p class="dm-hint">At least 8 characters. Use a made-up password, this is a demo.</p>' : ''}
          ${err}
          <button class="dm-btn" type="submit">${signup ? 'Create account' : 'Sign in'}</button>
        </form>`;
    }

    root.addEventListener('click', (e) => {
      const action = e.target.closest('[data-auth]')?.dataset.auth;
      if (!action) return;
      if (action === 'resend') {
        auth.resend(pendingEmail);
        render('A new code is in your inbox.');
        return;
      }
      mode = action;
      render();
    });

  // ---------------------------------------------------------------------------
  // Test-mode card checkout
  //
  // Mirrors how Stripe behaves in test mode: only published test card numbers
  // work, so nobody can type a real card into a demo. The card number is never
  // stored; a successful payment keeps the brand and last four digits.

  const TEST_CARDS = {
    4242424242424242: { brand: 'Visa', result: 'ok' },
    5555555555554444: { brand: 'Mastercard', result: 'ok' },
    378282246310005: { brand: 'Amex', result: 'ok' },
    4000002500003155: { brand: 'Visa', result: 'auth' },
    4000000000000002: { brand: 'Visa', result: 'declined' },
    4000000000009995: { brand: 'Visa', result: 'funds' },
  };

  function passesLuhn(digits) {
    let sum = 0;
    for (let i = 0; i < digits.length; i++) {
      let n = Number(digits[digits.length - 1 - i]);
      if (i % 2) {
        n *= 2;
        if (n > 9) n -= 9;
      }
      sum += n;
    }
    return digits.length >= 13 && sum % 10 === 0;
  }

  function cardError(digits, expiry, cvc) {
    if (!passesLuhn(digits)) return 'Your card number is incomplete or invalid.';
    const match = expiry.match(/^(\d{2})\s*\/\s*(\d{2})$/);
    if (!match || Number(match[1]) < 1 || Number(match[1]) > 12) return 'Enter the expiration date as MM / YY.';
    const end = new Date(2000 + Number(match[2]), Number(match[1]), 1);
    if (end <= new Date()) return "Your card's expiration date is in the past.";
    if (!/^\d{3,4}$/.test(cvc)) return "Your card's security code is incomplete.";
    return '';
  }

            <div><label for="dm-pay-zip">ZIP</label><input id="dm-pay-zip" name="zip" inputmode="numeric" maxlength="5" placeholder="76063" autocomplete="off"></div>

              <li><button type="button" data-fill="4000002500003155">4000 0025 0000 3155</button> asks the bank to confirm</li>
              <li><button type="button" data-fill="4000000000000002">4000 0000 0000 0002</button> card is declined</li>

      cardInput.focus();

      cardInput.addEventListener('input', () => {
        const digits = cardInput.value.replace(/\D/g, '').slice(0, 16);
        cardInput.value = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
      });
      expInput.addEventListener('input', () => {
        const d = expInput.value.replace(/\D/g, '').slice(0, 4);
        expInput.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : d;
      });

      function close() {
        layer.remove();
      }

      function fail(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        form.querySelector('button[type="submit"]').disabled = false;
      }

      layer.addEventListener('click', (e) => {
        const fill = e.target.closest('[data-fill]');

          cardInput.value = fill.dataset.fill.replace(/(\d{4})(?=\d)/g, '$1 ');

        }

        form.addEventListener('click', (e) => {
          const choice = e.target.closest('[data-bank]')?.dataset.bank;
          if (!choice) return;
          close();
          if (choice === 'ok') resolve(payment);
          else reject(new Error('Your bank did not approve the payment.'));
        });
      }
    });
  };

  Demo.toast = function (pane, message) {
    let stack = pane.querySelector(':scope > .dm-toasts');
    if (!stack) {
      stack = document.createElement('div');
      stack.className = 'dm-toasts';
      stack.setAttribute('role', 'status');
      pane.appendChild(stack);

    const el = document.createElement('div');
    el.className = 'dm-toast';
    el.textContent = message;
    stack.appendChild(el);
    while (stack.children.length > 3) stack.firstElementChild.remove();
    setTimeout(() => el.classList.add('is-out'), 2600);

  };

  Demo.delegate = function (root, handlers, type = 'click') {

          <div class="dm-scroll"><div class="dm-app" id="owner"></div></div>
        </section>
      </main>`;

    const split = document.querySelector('.dm-split');
    const narrow = window.matchMedia('(max-width: 860px)');
    let view = narrow.matches ? 'customer' : 'both';
    try {
      view = sessionStorage.getItem('dm-view:' + product) || view;
    } catch {}

    function applyView() {
      if (narrow.matches && view === 'both') view = 'customer';
      split.dataset.view = view;
      document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
      const badge = document.querySelector(`[data-badge="${view}"]`);
      if (badge) {

        badge.textContent = '';
      }

      if (!narrow.matches) view = 'both';
      applyView();
    });

      if (!btn) return;
      view = btn.dataset.view;
      try {
        sessionStorage.setItem('dm-view:' + product, view);
      } catch {}
      applyView();
    });

    const guide = document.querySelector('.dm-guide');
    const guideBtn = document.querySelector('[data-tool="guide"]');
    const resetBtn = document.querySelector('[data-tool="reset"]');
    let resetArmed = null;

    document.querySelector('.dm-tools').addEventListener('click', (e) => {
      const tool = e.target.closest('[data-tool]')?.dataset.tool;
      if (tool === 'guide') {
        guide.hidden = !guide.hidden;

        if (!resetArmed) {

            resetArmed = null;

    store.on((event) => {

        badge.hidden = false;
      }
    });

    applyView();
    return {
      customer: document.getElementById('customer'),
      owner: document.getElementById('owner'),
      customerPane: document.querySelector('[data-pane="customer"]'),
      ownerPane: document.querySelector('[data-pane="owner"]'),
    };
  };

})();

      <footer class="jk-foot">123 Sample St, Mansfield TX (fictional) · (555) 010-3398 · Tue to Sun</footer>
      <div class="jk-cartbar" data-slot="cartbar" hidden></div>
    </div>`;

  const $ = (sel) => C.querySelector(sel);
  const slot = (name) => C.querySelector(`[data-slot="${name}"]`);

  function renderOpenStatus() {
    const now = new Date();
    const hours = HOURS[now.getDay()];
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const open = hours && hhmm >= hours[0] && hhmm < hours[1];
    slot('open').className = 'jk-open' + (open ? ' is-open' : '');
    slot('open').textContent = open ? `Open now until ${Demo.niceTime(hours[1])}` : 'Closed right now. Bookings and orders are still open.';
  }

  function renderHeader() {
    const user = auth.current();
    slot('account-btn').textContent = user ? user.name.split(' ')[0] + "'s account" : 'Sign in';
    const unread = store.list('outbox').filter((m) => m.to !== OWNER_EMAIL && !m.read).length;
    slot('inbox-count').textContent = unread ? String(unread) : '';
  }

  function renderBooking() {
    const days = openDays(8);
    if (!booking.day || !days.includes(booking.day)) booking.day = days[0];
    slot('days').innerHTML = days
      .map((d, i) => {
        const label = i === 0 && d === Demo.dayKey(new Date()) ? 'Today' : Demo.niceDay(d, { weekday: 'short' });
        return `<button type="button" data-act="day" data-day="${d}" aria-pressed="${d === booking.day}"><b>${label}</b><span>${Demo.niceDay(d, { month: 'short', day: 'numeric' })}</span></button>`;
      })
      .join('');

    const times = slotsFor(booking.day);
    if (booking.time && !slotOpen(booking.day, booking.time)) booking.time = null;
    slot('times').innerHTML = times.length
      ? times
          .map((t) => {
            const open = slotOpen(booking.day, t);
            return `<button type="button" data-act="time" data-time="${t}" aria-pressed="${t === booking.time}" ${open ? '' : 'disabled'}>${Demo.niceTime(t)}${open ? '' : '<small>Full</small>'}</button>`;
          })
          .join('')
      : '<p class="dm-muted">No times left today. Pick another day.</p>';
  }

  function renderMenu() {
    const { soldOut, orderingOpen } = store.state.settings;
    slot('ordering-note').textContent = orderingOpen
      ? 'Ready in about 20 minutes. Pay online, grab it at the counter.'
      : 'Online ordering is paused for a bit. Call us and we will take your order by phone.';
    const cats = [...new Set(MENU.map((m) => m.cat))];
    slot('menu').innerHTML = cats
      .map(
        (cat) => `
        <div class="jk-cat">
          <h4>${esc(cat)}</h4>
          <ul>${MENU.filter((m) => m.cat === cat)
            .map((m) => {
              const out = soldOut[m.id];
              const inCart = cart.find((l) => l.id === m.id);
              return `
              <li class="${out ? 'is-out' : ''}">
                <div><b>${esc(m.name)}</b>${m.tag ? `<span class="jk-tag">${esc(m.tag)}</span>` : ''}<p>${esc(m.desc)}</p></div>
                <span class="jk-price">${money(m.price)}</span>
                ${out ? '<span class="jk-soldout">Sold out</span>' : `<button type="button" class="jk-add" data-act="add" data-id="${m.id}" ${orderingOpen ? '' : 'disabled'} aria-label="Add ${esc(m.name)}">${inCart ? inCart.qty + ' in order' : 'Add'}</button>`}
              </li>`;
            })
            .join('')}</ul>
        </div>`,
      )
      .join('');
  }

  function renderCartBar() {
    const bar = slot('cartbar');
    cart = cart.filter((l) => !store.state.settings.soldOut[l.id]);
    const count = cart.reduce((n, l) => n + l.qty, 0);
    bar.hidden = !count || !store.state.settings.orderingOpen;
    if (bar.hidden) return;
    bar.innerHTML = `<span>${count} item${count > 1 ? 's' : ''} · ${money(orderTotals(cart).subtotal)}</span><button type="button" class="dm-btn" data-act="cart">View order</button>`;
  }

  // Slide-over panels inside the customer pane: cart, account, inbox.
  function openPanel(kind) {
    customerPanel = kind;
    renderPanel();
  }
  function closePanel() {
    customerPanel = null;
    frame.customerPane.querySelector('.jk-panel')?.remove();
  }

  function renderPanel() {
    let panel = frame.customerPane.querySelector('.jk-panel');
    if (!customerPanel) return panel?.remove();
    if (!panel) {
      panel = document.createElement('aside');
      panel.className = 'jk-panel dm-app';
      frame.customerPane.appendChild(panel);
      Demo.delegate(panel, customerActions);
    }
    const body = { cart: cartPanel, account: accountPanel, inbox: inboxPanel }[customerPanel]();
    panel.innerHTML = `<div class="jk-panel-in"><button type="button" class="jk-close" data-act="close" aria-label="Close">Close</button>${body}</div>`;
    if (customerPanel === 'account' && !auth.current()) {
      Demo.mountAuthForm(panel.querySelector('[data-slot="panel-auth"]'), auth, {
        intro: 'Your account keeps your bookings and orders in one place.',
        onDone: () => renderPanel(),
      });
    }
  }

  function cartPanel() {
    if (!cart.length) return '<h3>Your order</h3><p class="dm-muted">Nothing here yet. Add something from the menu.</p>';
    const t = orderTotals(cart);
    const lines = cart
      .map((l) => {
        const m = menuItem(l.id);
        return `<li><span>${esc(m.name)}</span><span class="jk-qty"><button type="button" data-act="qty" data-id="${l.id}" data-d="-1" aria-label="One less">−</button>${l.qty}<button type="button" data-act="qty" data-id="${l.id}" data-d="1" aria-label="One more">+</button></span><span>${money(m.price * l.qty)}</span></li>`;
      })
      .join('');
    return `
      <h3>Your order</h3>
      <ul class="jk-lines">${lines}</ul>
      <dl class="jk-sum"><dt>Subtotal</dt><dd>${money(t.subtotal)}</dd><dt>Tax (8.25%)</dt><dd>${money(t.tax)}</dd><dt>Total</dt><dd><b>${money(t.total)}</b></dd></dl>
      <label for="jk-pickup">Pickup time</label>
      <select id="jk-pickup" name="pickup"><option>ASAP (about 20 min)</option><option>In 45 minutes</option><option>In 1 hour</option></select>
      <label for="jk-oname">Name for the order</label>
      <input id="jk-oname" name="oname" autocomplete="name" value="${esc(auth.current()?.name || '')}">
      <p class="dm-err" data-slot="cart-err" hidden></p>
      <button type="button" class="dm-btn" data-act="pay">Pay ${money(t.total)}</button>`;
  }

  function accountPanel() {
    const user = auth.current();
    if (!user) return '<h3>Your account</h3><div data-slot="panel-auth"></div>';
    const mine = store.list('reservations').filter((r) => r.email === user.email);
    const orders = store.list('orders').filter((o) => o.email === user.email);
    const resHtml = mine.length
      ? mine
          .map(
            (r) => `
          <li class="jk-res">
            <div><b>${Demo.niceDay(r.day)} at ${Demo.niceTime(r.time)}</b><span>${r.party} ${r.party > 1 ? 'guests' : 'guest'}${r.note ? ' · ' + esc(r.note) : ''}</span></div>
            <span class="jk-status is-${r.status}">${STATUS_TEXT[r.status]}</span>
            ${['requested', 'confirmed'].includes(r.status) ? `<button type="button" class="dm-link" data-act="cancel-res" data-id="${r.id}">Cancel booking</button>` : ''}
          </li>`,
          )
          .join('')
      : '<li class="dm-muted">No bookings yet.</li>';
    const orderHtml = orders.length
      ? orders
          .map((o) => {
            const step = ORDER_STEPS.indexOf(o.status);
            return `
          <li class="jk-order">
            <div><b>Order #${o.number}</b><span>${o.items.map((l) => l.qty + '× ' + esc(menuItem(l.id).name)).join(', ')}</span></div>
            <ol class="jk-track">${ORDER_STEPS.map((s, i) => `<li class="${i <= step ? 'is-done' : ''}">${ORDER_TEXT[s]}</li>`).join('')}</ol>
          </li>`;
          })
          .join('')
      : '<li class="dm-muted">No orders yet.</li>';
    return `
      <h3>Hi, ${esc(user.name.split(' ')[0])}</h3>
      <p class="dm-muted">${esc(user.email)}</p>
      <h4>Your bookings</h4><ul class="jk-list">${resHtml}</ul>
      <h4>Your orders</h4><ul class="jk-list">${orderHtml}</ul>
      <button type="button" class="dm-link" data-act="signout">Sign out</button>`;
  }

  function inboxPanel() {
    const mail = store.list('outbox').filter((m) => m.to !== OWNER_EMAIL);
    mail.forEach((m) => (m.read = true));
    return `
      <h3>Demo inbox</h3>
      <p class="dm-muted">Every email the site sends to customers lands here instead of going out.</p>
      <div class="jk-mail">${mail.length ? mail.map((m) => Demo.renderEmail(m, BRAND)).join('') : '<p class="dm-muted">No emails yet. Create an account or book a table.</p>'}</div>`;
  }

  async function submitBooking() {
    const err = slot('book-err');
    err.hidden = true;
    if (!booking.time) {
      err.textContent = 'Pick a time for your table.';
      err.hidden = false;
      return;
    }
    const user = auth.current();
    if (!user) {
      booking.awaitingAuth = true;
      const box = slot('book-auth');
      box.hidden = false;
      Demo.mountAuthForm(box, auth, {
        intro: `Almost done. Sign in or create an account to hold ${Demo.niceTime(booking.time)} on ${Demo.niceDay(booking.day)}.`,
        onDone: () => {
          box.hidden = true;
          box.innerHTML = '';
          submitBooking();
        },
      });
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    if (!slotOpen(booking.day, booking.time)) {
      err.textContent = 'Someone just took that time. Pick another one.';
      err.hidden = false;
      renderBooking();
      return;
    }
    booking.awaitingAuth = false;
    const status = store.state.settings.autoConfirm ? 'confirmed' : 'requested';
    const res = store.insert(
      'reservations',
      { name: user.name, email: user.email, party: booking.party, day: booking.day, time: booking.time, note: booking.note.trim(), status },
      { by: 'customer', note: `New booking: ${user.name}, ${booking.party} at ${Demo.niceTime(booking.time)}` },
    );
    Demo.sendEmail(store, {
      to: user.email,
      subject: status === 'confirmed' ? 'Your table is confirmed' : 'We got your booking request',
      lines: [
        `Hi ${user.name.split(' ')[0]},`,
        `${status === 'confirmed' ? 'You are all set' : 'Thanks! The kitchen will confirm shortly'}: ${res.party} ${res.party > 1 ? 'guests' : 'guest'}, ${Demo.niceDay(res.day)} at ${Demo.niceTime(res.time)}.`,
        'Need to change it? Open your account on our site and cancel, then book again.',
      ],
    });
    Demo.sendEmail(store, {
      to: OWNER_EMAIL,
      subject: `New booking: ${user.name}`,
      lines: [`${res.party} guests, ${Demo.niceDay(res.day)} ${Demo.niceTime(res.time)}`],
    });
    booking.time = null;
    booking.note = '';
    $('#jk-note').value = '';
    Demo.toast(frame.customerPane, status === 'confirmed' ? 'Table booked. Check your inbox.' : 'Request sent. Check your inbox.');
    openPanel('account');
  }

  async function pay() {
    const name = frame.customerPane.querySelector('#jk-oname').value.trim();
    const pickup = frame.customerPane.querySelector('#jk-pickup').value;
    const err = frame.customerPane.querySelector('[data-slot="cart-err"]');
    if (!name) {
      err.textContent = 'Add a name so we know whose order it is.';
      err.hidden = false;
      return;
    }
    const totals = orderTotals(cart);
    const user = auth.current();
    let payment;
    try {
      payment = await Demo.checkout(frame.customerPane, { amount: totals.total, label: `${BRAND} pickup order`, email: user?.email || '' });
    } catch (e) {
      if (e.message !== 'cancelled') Demo.toast(frame.customerPane, e.message);
      return;
    }
    const number = store.state.nextOrder++;
    const order = store.insert(
      'orders',
      {
        number,
        name,
        email: payment.email,
        items: cart.map((l) => ({ ...l })),
        total: totals.total,
        status: 'new',
        pickup,
        payment: { brand: payment.brand, last4: payment.last4, id: payment.id },
      },
      { by: 'customer', note: `New order #${number} from ${name}, ${money(totals.total)}` },
    );
    Demo.sendEmail(store, {
      to: payment.email,
      subject: `Order #${number} received`,
      lines: [
        `Thanks, ${name.split(' ')[0]}! We are on it.`,
        `${order.items.map((l) => l.qty + '× ' + menuItem(l.id).name).join(', ')}`,
        `Paid ${money(order.total)} with ${payment.brand} ending ${payment.last4} (test mode). Pickup: ${pickup}.`,
      ],
    });
    cart = [];
    if (user && user.email === payment.email) openPanel('account');
    else {
      closePanel();
      Demo.toast(frame.customerPane, `Order #${number} placed. Receipt is in the inbox.`);
    }
    renderMenu();
    renderCartBar();
  }

  const customerActions = {
    day(el) {
      booking.day = el.dataset.day;
      booking.time = null;
      renderBooking();
    },
    time(el) {
      booking.time = el.dataset.time;
      renderBooking();
    },
    add(el) {
      const line = cart.find((l) => l.id === el.dataset.id);
      if (line) line.qty += 1;
      else cart.push({ id: el.dataset.id, qty: 1 });
      renderMenu();
      renderCartBar();
    },
    qty(el) {
      const line = cart.find((l) => l.id === el.dataset.id);
      line.qty += Number(el.dataset.d);
      cart = cart.filter((l) => l.qty > 0);
      renderMenu();
      renderCartBar();
      renderPanel();
    },
    cart: () => openPanel('cart'),
    account: () => openPanel('account'),
    inbox() {
      openPanel('inbox');
      renderHeader();
    },
    close: closePanel,
    pay,
    signout() {
      auth.signOut();
      renderPanel();
    },
    'cancel-res'(el) {
      const r = store.find('reservations', el.dataset.id);
      store.update(
        'reservations',
        r.id,
        { status: 'cancelled' },
        { by: 'customer', note: `${r.name} cancelled ${Demo.niceTime(r.time)} on ${Demo.niceDay(r.day)}` },
      );
    },
  };

  Demo.delegate(C, customerActions);
  $('#jk-party').addEventListener('change', (e) => (booking.party = Number(e.target.value)));
  $('#jk-note').addEventListener('input', (e) => (booking.note = e.target.value));
  $('[data-form="book"]').addEventListener('submit', (e) => {
    e.preventDefault();
    submitBooking();
  });

  function renderCustomer() {
    renderOpenStatus();
    renderHeader();
    renderBooking();
    renderMenu();
    renderCartBar();
    // Leave the sign-in form alone while someone is filling it in.
    const signingIn = customerPanel === 'account' && !auth.current();
    if (customerPanel && customerPanel !== 'cart' && !signingIn) renderPanel();
  }

  // ===========================================================================
  // Owner view

  const O = frame.owner;
  let ownerTab = 'bookings';
  let ownerDay = null;

  function ownerStats() {
    const today = Demo.dayKey(new Date());
    const res = store.list('reservations');
    const covers = res.filter((r) => r.day === today && ['confirmed', 'seated'].includes(r.status)).reduce((n, r) => n + r.party, 0);
    const waiting = res.filter((r) => r.status === 'requested').length;
    const orders = store.list('orders');
    const open = orders.filter((o) => o.status !== 'picked').length;
    const sales = orders.filter((o) => Demo.dayKey(o.createdAt) === today).reduce((n, o) => n + o.total, 0);
    return [
      ['Guests booked today', covers],
      ['Bookings to confirm', waiting, waiting ? 'is-alert' : ''],
      ['Orders in the kitchen', open, open ? 'is-warm' : ''],
      ['Online sales today', money(sales)],
    ];
  }

  function bookingsTab() {
    const res = store.list('reservations');
    const days = [...new Set([Demo.dayKey(new Date()), ...res.filter((r) => r.day >= Demo.dayKey(new Date())).map((r) => r.day)])].sort();
    if (!days.includes(ownerDay)) ownerDay = days.find((d) => res.some((r) => r.day === d)) || days[0];
    const list = res.filter((r) => r.day === ownerDay).sort((a, b) => a.time.localeCompare(b.time));
    const rows = list.length
      ? list
          .map((r) => {
            const actions =
              {
                requested: `<button type="button" class="jk-o-btn is-go" data-act="res" data-id="${r.id}" data-to="confirmed">Confirm</button><button type="button" class="jk-o-btn" data-act="res" data-id="${r.id}" data-to="declined">Decline</button>`,
                confirmed: `<button type="button" class="jk-o-btn is-go" data-act="res" data-id="${r.id}" data-to="seated">Seated</button><button type="button" class="jk-o-btn" data-act="res" data-id="${r.id}" data-to="noshow">No-show</button>`,
              }[r.status] || '';
            return `
            <tr class="${r.status === 'requested' ? 'is-new' : ''}">
              <td class="jk-o-time">${Demo.niceTime(r.time)}</td>
              <td><b>${esc(r.name)}</b><span>${esc(r.email)}${r.note ? ' · ' + esc(r.note) : ''}</span></td>
              <td class="jk-o-num">${r.party}</td>
              <td><span class="jk-status is-${r.status}">${STATUS_TEXT[r.status].replace('Waiting for the restaurant', 'Needs reply')}</span></td>
              <td class="jk-o-acts">${actions}</td>
            </tr>`;
          })
          .join('')
      : '<tr><td colspan="5" class="dm-muted">No bookings for this day yet.</td></tr>';
    return `
      <div class="jk-o-days">${days.map((d) => `<button type="button" data-act="oday" data-day="${d}" aria-pressed="${d === ownerDay}">${d === Demo.dayKey(new Date()) ? 'Today' : Demo.niceDay(d)}<small>${res.filter((r) => r.day === d && !['cancelled', 'declined'].includes(r.status)).length}</small></button>`).join('')}</div>
      <div class="jk-o-table"><table>
        <thead><tr><th>Time</th><th>Guest</th><th>Party</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  function ordersTab() {
    const orders = store.list('orders');
    const col = (status, title, next, nextLabel) => {
      const list = orders.filter((o) => o.status === status);
      return `
        <div class="jk-o-col">
          <h4>${title} <span>${list.length}</span></h4>
          ${
            list
              .map(
                (o) => `
            <article class="jk-ticket">
              <header><b>#${o.number}</b><span>${Demo.ago(o.createdAt)}</span></header>
              <p class="jk-ticket-name">${esc(o.name)} · ${esc(o.pickup)}</p>
              <ul>${o.items.map((l) => `<li><b>${l.qty}×</b> ${esc(menuItem(l.id).name)}</li>`).join('')}</ul>
              <footer><span>${money(o.total)} · ${esc(o.payment.brand)} ••${esc(o.payment.last4)}</span>
              ${next ? `<button type="button" class="jk-o-btn is-go" data-act="order" data-id="${o.id}" data-to="${next}">${nextLabel}</button>` : ''}</footer>

      <div class="jk-o-board">

        ${col('ready', 'Ready', 'picked', 'Picked up')}

      <p class="dm-muted jk-o-foot">${done} picked up today. Paid orders show the card brand and last four digits only.</p>`;

      <p class="dm-muted">Mark something sold out and it stops showing an Add button on the site right away.</p>

        (m) => `
        <li><div><b>${esc(m.name)}</b><span>${esc(m.cat)} · ${money(m.price)}</span></div>
        <label class="jk-switch"><input type="checkbox" data-act="soldout" data-id="${m.id}" ${soldOut[m.id] ? '' : 'checked'}><span>${soldOut[m.id] ? 'Sold out' : 'Available'}</span></label></li>`,

        <label class="jk-switch jk-o-row"><span><b>Take online orders</b><small>Pause this on a slammed night. The menu stays visible.</small></span><input type="checkbox" data-act="setting" data-name="orderingOpen" ${s.orderingOpen ? 'checked' : ''}></label>
        <div class="jk-o-row"><span><b>Tables per time slot</b><small>How many bookings can start at the same time.</small></span>

        <form class="jk-o-row jk-o-block" data-form="block"><span><b>Block a time</b><small>Private party or short-staffed? Close a slot to new bookings.</small></span>

            <select name="time" aria-label="Time">${slotsFor(days[0])
              .map((t) => `<option value="${t}">${Demo.niceTime(t)}</option>`)
              .join('')}</select>
            <button type="submit" class="jk-o-btn">Block</button>
          </span></form>

      </div>`;

  function emailsTab() {
    const mail = store.list('outbox');
    return `<p class="dm-muted">Everything the system sent, newest first. On a live site these go out from the restaurant's address.</p>
      <div class="jk-mail">${mail.map((m) => Demo.renderEmail(m, BRAND)).join('') || '<p class="dm-muted">No emails yet.</p>'}</div>`;
  }

  function renderOwner() {
    const scrollBox = O.closest('.dm-scroll');
    const keep = scrollBox.scrollTop;
    const waiting = store.list('reservations').filter((r) => r.status === 'requested').length;
    const cooking = store.list('orders').filter((o) => o.status === 'new').length;
    const tabs = [
      ['bookings', 'Bookings', waiting],
      ['orders', 'Orders', cooking],
      ['menu', 'Menu'],
      ['settings', 'Settings'],
      ['emails', 'Emails'],
    ];
    const body = { bookings: bookingsTab, orders: ordersTab, menu: menuTab, settings: settingsTab, emails: emailsTab }[ownerTab]();
    O.innerHTML = `
      <div class="jk-o">
        <header class="jk-o-head">
          <div><b>Juniper Street Kitchen</b><span>${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</span></div>
          <span class="jk-o-who">Signed in as owner</span>
        </header>
        <div class="jk-o-stats">${ownerStats()
          .map(([label, value, cls]) => `<div class="${cls || ''}"><b>${value}</b><span>${label}</span></div>`)
          .join('')}</div>
        <nav class="jk-o-tabs">${tabs.map(([id, label, n]) => `<button type="button" data-act="otab" data-tab="${id}" aria-pressed="${id === ownerTab}">${label}${n ? `<span>${n}</span>` : ''}</button>`).join('')}</nav>
        <div class="jk-o-body">${body}</div>
        <section class="jk-o-activity"><h4>Live activity</h4><ul>${store
          .list('activity')
          .slice(0, 8)
          .map((a) => `<li><span class="jk-dot is-${a.by}"></span>${esc(a.note)}<time>${Demo.ago(a.at)}</time></li>`)
          .join('')}</ul></section>
      </div>`;
    scrollBox.scrollTop = keep;
  }

  function emailGuest(r, subject, line) {
    Demo.sendEmail(store, { to: r.email, subject, lines: [`Hi ${r.name.split(' ')[0]},`, line, `${BRAND} · (555) 010-3398`] });
  }

  const ownerActions = {
    otab(el) {
      ownerTab = el.dataset.tab;
      renderOwner();
    },
    oday(el) {
      ownerDay = el.dataset.day;
      renderOwner();
    },
    res(el) {
      const r = store.find('reservations', el.dataset.id);
      const to = el.dataset.to;
      const when = `${Demo.niceDay(r.day)} at ${Demo.niceTime(r.time)}`;
      if (to === 'confirmed') emailGuest(r, 'Your table is confirmed', `See you ${when}. We have a table for ${r.party}.`);
      if (to === 'declined')
        emailGuest(r, 'About your booking', `Sorry, we can't fit ${r.party} on ${when}. Please pick another time on our site.`);
      const verbs = { confirmed: 'Confirmed', declined: 'Declined', seated: 'Seated', noshow: 'Marked no-show for' };
      store.update('reservations', r.id, { status: to }, { by: 'owner', note: `${verbs[to]} ${r.name}, ${Demo.niceTime(r.time)}` });
    },
    order(el) {
      const o = store.find('orders', el.dataset.id);
      const to = el.dataset.to;
      if (to === 'ready')
        Demo.sendEmail(store, {
          to: o.email,
          subject: `Order #${o.number} is ready`,
          lines: [`Hi ${o.name.split(' ')[0]}, your order is ready at the counter.`, 'Show this email or give your name.'],
        });
      store.update('orders', o.id, { status: to }, { by: 'owner', note: `Order #${o.number}: ${ORDER_TEXT[to].toLowerCase()}` });
    },
    soldout(el) {
      const soldOut = { ...store.state.settings.soldOut, [el.dataset.id]: !el.checked };
      store.setting('soldOut', soldOut, { by: 'owner', note: `${menuItem(el.dataset.id).name} is ${el.checked ? 'back on' : 'sold out'}` });
    },
    setting(el) {
      const labels = { autoConfirm: ['Auto-confirm on', 'Auto-confirm off'], orderingOpen: ['Online orders open', 'Online orders paused'] };
      store.setting(el.dataset.name, el.checked, { by: 'owner', note: labels[el.dataset.name][el.checked ? 0 : 1] });
    },
    tables(el) {
      const n = Math.min(12, Math.max(1, store.state.settings.tablesPerSlot + Number(el.dataset.d)));
      store.setting('tablesPerSlot', n, { by: 'owner', note: `Tables per slot set to ${n}` });
    },
    unblock(el) {
      const key = el.dataset.key;
      store.setting(
        'blocked',
        store.state.settings.blocked.filter((b) => b !== key),
        { by: 'owner', note: `Reopened ${Demo.niceDay(key.slice(0, 10))} ${Demo.niceTime(key.slice(11))}` },
      );
    },
  };

  O.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (el && el.tagName !== 'INPUT' && ownerActions[el.dataset.act]) ownerActions[el.dataset.act](el, e);
  });
  O.addEventListener('change', (e) => {
    const el = e.target;
    if (el.matches('input[data-act]') && ownerActions[el.dataset.act]) ownerActions[el.dataset.act](el, e);
    if (el.name === 'day' && el.closest('[data-form="block"]')) {
      el.form.time.innerHTML = slotsFor(el.value)
        .map((t) => `<option value="${t}">${Demo.niceTime(t)}</option>`)
        .join('');
    }
  });
  O.addEventListener('submit', (e) => {
    if (e.target.dataset.form !== 'block') return;
    e.preventDefault();
    const key = e.target.day.value + ' ' + e.target.time.value;
    const blocked = store.state.settings.blocked;
    if (!blocked.includes(key))
      store.setting('blocked', [...blocked, key].sort(), {
        by: 'owner',
        note: `Blocked ${Demo.niceDay(key.slice(0, 10))} ${Demo.niceTime(key.slice(11))}`,
      });
  });

  store.on((event) => {
    if (event.action === 'reset') {
      cart = [];
      booking.time = null;
      closePanel();
      slot('book-auth').hidden = true;
    }
    renderCustomer();
    renderOwner();
  });

  renderCustomer();
  renderOwner();
  setInterval(() => {
    renderOpenStatus();
    if (ownerTab === 'orders') renderOwner();
  }, 60000);
})();

</script>
</body>
</html>
