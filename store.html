/* Split-screen frame and shared widgets (sign-in, checkout, email, toasts).
   Layout: a slim top bar, then two independently scrolling panes. */

:root {
  --frame-bg: #e9ebee;
  --frame-bar: #ffffff;
  --frame-ink: #1b2027;
  --frame-muted: #5d6673;
  --frame-line: #d5d9df;
  --frame-accent: #1f6feb;
  --frame-ping: #f2b705;
  --frame-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --frame-bg: #0f1216;
    --frame-bar: #171b21;
    --frame-ink: #e7eaee;
    --frame-muted: #9aa3ae;
    --frame-line: #2a3039;
    --frame-accent: #5b9dff;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --frame-bg: #0f1216;
  --frame-bar: #171b21;
  --frame-ink: #e7eaee;
  --frame-muted: #9aa3ae;
  --frame-line: #2a3039;
  --frame-accent: #5b9dff;
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}
html,
body.dm-body {
  height: 100%;
}
body.dm-body {
  margin: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--frame-bg);
  color: var(--frame-ink);
  font-family: var(--frame-ui);
  overflow: hidden;
}
body.dm-body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--frame-bar);
}

.dm-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--frame-bar);
  border-bottom: 1px solid var(--frame-line);
  z-index: 5;
}
.dm-id {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  flex: 1 1 260px;
}
.dm-id h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.dm-id p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--frame-muted);
}
.dm-back {
  flex: none;
  font-size: 12px;
  color: var(--frame-muted);
  text-decoration: none;
  padding: 6px 10px;
  border: 1px solid var(--frame-line);
  border-radius: 6px;
}
.dm-back:hover {
  color: var(--frame-ink);
}

.dm-views {
  display: flex;
  padding: 3px;
  border-radius: 8px;
  background: var(--frame-bg);
  border: 1px solid var(--frame-line);
}
.dm-views button,
.dm-tool {
  font: 500 13px/1 var(--frame-ui);
  color: var(--frame-muted);
  background: none;
  border: 0;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.dm-views button[aria-pressed='true'] {
  background: var(--frame-bar);
  color: var(--frame-ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
.dm-tools {
  display: flex;
  gap: 6px;
}
.dm-tool[data-tool='reset'] {
  min-width: 5.5em;
  justify-content: center;
}
.dm-tool {
  border: 1px solid var(--frame-line);
}
.dm-tool:hover,
.dm-views button:hover {
  color: var(--frame-ink);
}
.dm-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--frame-ping);
  color: #1b1600;
  font-size: 11px;
  font-weight: 700;
  display: inline-grid;
  place-items: center;
}
.dm-guide {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(100% + 6px);
  width: min(420px, calc(100vw - 32px));
  margin: 0;
  padding: 16px 18px 16px 36px;
  background: var(--frame-bar);
  color: var(--frame-ink);
  border: 1px solid var(--frame-line);
  border-radius: 10px;
  box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.35);
  font-size: 14px;
  line-height: 1.5;
  display: grid;
  gap: 8px;
}

.dm-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--frame-line);
  min-height: 0;
}
.dm-split[data-view='customer'],
.dm-split[data-view='owner'] {
  grid-template-columns: 1fr;
}
.dm-split[data-view='customer'] [data-pane='owner'],
.dm-split[data-view='owner'] [data-pane='customer'] {
  display: none;
}

.dm-pane {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--frame-bg);
}
.dm-plabel {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px max(16px, env(safe-area-inset-left, 0px));
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--frame-ink);
  background: var(--frame-bar);
  border-bottom: 1px solid var(--frame-line);
}
.dm-plabel small {
  font-weight: 400;
  color: var(--frame-muted);
}
.dm-live {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #2ea36a;
  box-shadow: 0 0 0 3px rgba(46, 163, 106, 0.18);
}
.dm-pane.is-pinged .dm-plabel {
  animation: dm-ping 1.4s ease-out;
}
@keyframes dm-ping {
  0% {
    background: var(--frame-ping);
  }
  100% {
    background: var(--frame-bar);
  }
}
.dm-scroll {
  display: grid;
  overflow: auto;
  min-height: 0;
  overscroll-behavior: contain;
}
.dm-app {
  display: grid;
  align-content: stretch;
  container-type: inline-size;
}
.dm-app > * {
  min-width: 0;
  align-self: start;
}

.dm-short {
  display: none;
}
@media (max-width: 860px) {
  .dm-wide-only {
    display: none !important;
  }
  .dm-long {
    display: none;
  }
  .dm-short {
    display: inline;
  }
  .dm-bar {
    gap: 8px;
  }
  .dm-id {
    flex-basis: 100%;
  }
  .dm-views {
    flex: 1;
  }
  .dm-views button {
    flex: 1;
    justify-content: center;
  }
}
@media (max-width: 420px) {
  .dm-tool {
    padding: 8px;
    font-size: 12px;
  }
  .dm-id p {
    display: none;
  }
}

/* ---- Shared widgets. Each demo sets the --dm-* colors on .dm-app. ---- */

.dm-app {
  --dm-accent: #1f6feb;
  --dm-on-accent: #fff;
  --dm-ink: #1b2027;
  --dm-muted: #5d6673;
  --dm-surface: #fff;
  --dm-line: #d5d9df;
  --dm-radius: 8px;
}
.dm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 20px;
  font: inherit;
  font-weight: 650;
  color: var(--dm-on-accent);
  background: var(--dm-accent);
  border: 0;
  border-radius: var(--dm-radius);
  cursor: pointer;
}
.dm-btn:disabled {
  opacity: 0.6;
  cursor: progress;
}
.dm-link {
  font: inherit;
  color: var(--dm-accent);
  background: none;
  border: 0;
  padding: 8px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dm-muted {
  color: var(--dm-muted);
}
.dm-hint {
  margin: -4px 0 0;
  font-size: 13px;
  color: var(--dm-muted);
}
.dm-err {
  margin: 0;
  padding: 10px 12px;
  border-radius: 6px;
  background: #fdecea;
  color: #8a1f11;
  font-size: 14px;
}

.dm-auth,
.dm-pay {
  display: grid;
  gap: 10px;
}
.dm-auth h3,
.dm-pay h3 {
  margin: 0;
}
.dm-auth label,
.dm-pay label {
  font-size: 13px;
  font-weight: 600;
  color: var(--dm-ink);
}
.dm-auth input,
.dm-pay input {
  width: 100%;
  box-sizing: border-box;
  min-height: 44px;
  padding: 0 12px;
  font: inherit;
  color: var(--dm-ink);
  background: var(--dm-surface);
  border: 1px solid var(--dm-line);
  border-radius: calc(var(--dm-radius) * 0.75);
}
.dm-auth input:focus,
.dm-pay input:focus,
.dm-btn:focus-visible,
.dm-link:focus-visible {
  outline: 2px solid var(--dm-accent);
  outline-offset: 2px;
}
.dm-seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--dm-line);
  border-radius: var(--dm-radius);
  overflow: hidden;
}
.dm-seg button {
  font: inherit;
  font-size: 14px;
  padding: 10px;
  border: 0;
  background: none;
  color: var(--dm-muted);
  cursor: pointer;
}
.dm-seg button[aria-selected='true'] {
  background: var(--dm-ink);
  color: var(--dm-surface);
}

.dm-layer {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(10, 12, 16, 0.55);
  overflow: auto;
}
.dm-pay {
  width: min(420px, 100%);
  box-sizing: border-box;
  padding: 22px;
  border-radius: 12px;
  background: #fff;
  color: #1a1f36;
  font-family: var(--frame-ui);
  font-size: 15px;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
  --dm-accent: #635bff;
  --dm-on-accent: #fff;
  --dm-ink: #1a1f36;
  --dm-muted: #5e6479;
  --dm-surface: #fff;
  --dm-line: #d8dbe4;
  --dm-radius: 8px;
}
.dm-pay-mode {
  justify-self: start;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8a4b00;
  background: #ffe7c2;
  padding: 4px 8px;
  border-radius: 4px;
}
.dm-pay-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 8px;
}
.dm-pay-row > div {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.dm-pay-cards {
  font-size: 13px;
  color: #5e6479;
  border-top: 1px solid #e6e8ee;
  padding-top: 10px;
}
.dm-pay-cards summary {
  cursor: pointer;
  font-weight: 600;
  color: #1a1f36;
}
.dm-pay-cards ul {
  list-style: none;
  margin: 8px 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.dm-pay-cards button {
  font:
    12px ui-monospace,
    Menlo,
    Consolas,
    monospace;
  padding: 4px 6px;
  border: 1px solid #d8dbe4;
  border-radius: 4px;
  background: #f6f8fa;
  cursor: pointer;
  color: #1a1f36;
}

.dm-mail {
  padding: 16px 18px;
  border: 1px solid var(--dm-line);
  border-radius: var(--dm-radius);
  background: var(--dm-surface);
  color: var(--dm-ink);
  font-size: 14px;
  line-height: 1.5;
}
.dm-mail header {
  border-bottom: 1px solid var(--dm-line);
  margin-bottom: 10px;
  padding-bottom: 8px;
}
.dm-mail h4 {
  margin: 6px 0 0;
  font-size: 15px;
}
.dm-mail p {
  margin: 0 0 8px;
}
.dm-mail-from {
  font-weight: 650;
}
.dm-mail-from span,
.dm-mail-to {
  font-size: 12px;
  color: var(--dm-muted);
  font-weight: 400;
}
.dm-mail-code {
  font:
    700 26px/1 ui-monospace,
    Menlo,
    Consolas,
    monospace;
  letter-spacing: 0.3em;
  padding: 12px 0 4px;
  user-select: all;
}

.dm-toasts {
  position: absolute;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  display: grid;
  justify-items: center;
  gap: 8px;
  pointer-events: none;
}
.dm-toast {
  padding: 10px 16px;
  border-radius: 8px;
  background: #1b2027;
  color: #fff;
  font: 500 14px/1.35 var(--frame-ui);
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
  transition:
    opacity 0.3s,
    transform 0.3s;
}
.dm-toast.is-out {
  opacity: 0;
  transform: translateY(8px);
}

@media (prefers-reduced-motion: reduce) {
  .dm-pane.is-pinged .dm-plabel {
    animation: none;
  }
  .dm-toast {
    transition: none;
  }
}

/* Lantana & Ash. Plum ink on pale stone, lantana pink for actions and
   marigold for small highlights. Filters sit in a left rail on wide panes
   and fold above the grid on narrow ones. */

#customer,
#owner,
.la-panel {
  --stone: #efece8;
  --paper: #fbfaf8;
  --plum: #2b1f2e;
  --pink: #c93a6f;
  --pink-soft: #f7dbe5;
  --marigold: #f0a830;
  --muted: #6e6370;
  --line: #ddd6d9;
  --display: 'Fraunces', Georgia, serif;
  --body: 'Figtree', system-ui, sans-serif;
  --dm-accent: var(--pink);
  --dm-ink: var(--plum);
  --dm-muted: var(--muted);
  --dm-surface: #fff;
  --dm-line: var(--line);
  --dm-radius: 999px;
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  color: var(--plum);
  background: var(--stone);
}
#owner {
  background: #f6f4f6;
  --dm-radius: 8px;
}

.la h2,
.la h3,
.la-panel h3 {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
}
.la-sample {
  margin: 0;
  padding: 7px 16px;
  text-align: center;
  font-size: 12px;
  background: var(--marigold);
  color: var(--plum);
}

.la-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 14px 22px;
  background: var(--stone);
  border-bottom: 1px solid var(--line);
}
.la-logo {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  color: var(--plum);
  text-decoration: none;
  letter-spacing: -0.02em;
}
.la-logo i {
  color: var(--pink);
  font-weight: 400;
}
.la-nav {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.la-nav button {
  font: 600 14px var(--body);
  color: var(--plum);
  background: none;
  border: 0;
  padding: 9px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.la-nav button:hover {
  background: rgba(43, 31, 46, 0.07);
}
.la-nav span {
  color: var(--pink);
}
.la-nav .la-bagbtn {
  background: var(--plum);
  color: #fff;
  display: inline-flex;
  gap: 8px;
}
.la-nav .la-bagbtn span {
  color: var(--plum);
  background: var(--marigold);
  border-radius: 9px;
  padding: 0 6px;
  font-size: 12px;
  line-height: 18px;
}

.la-hero {
  padding: 40px 22px 30px;
  display: grid;
  gap: 10px;
}
.la-hero h2 {
  font-size: clamp(30px, 6.4cqi, 54px);
  line-height: 1.02;
  max-width: 16ch;
  font-weight: 500;
}
.la-hero p {
  margin: 0;
  max-width: 52ch;
  color: var(--muted);
}

.la-shop {
  display: grid;
  gap: 18px;
  padding: 0 22px 40px;
}
.la-filters {
  display: grid;
  gap: 14px;
  align-content: start;
}
.la-filters fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 8px;
}
.la-filters legend,
.la-search span {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0;
  margin-bottom: 6px;
}
.la-search {
  display: grid;
}
.la-search input,
.la-filters select,
.la-bar select {
  font: inherit;
  color: var(--plum);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 14px;
  min-height: 40px;
  box-sizing: border-box;
  width: 100%;
}
.la-bar select {
  width: auto;
  margin-left: 6px;
}
.la-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.la-chips button {
  font: 600 13px var(--body);
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--plum);
  cursor: pointer;
}
.la-chips button[aria-pressed='true'] {
  background: var(--pink);
  border-color: var(--pink);
  color: #fff;
}
.la-filters input[type='range'] {
  width: 100%;
  accent-color: var(--pink);
}
.la-filters output {
  font-size: 14px;
  font-weight: 600;
}
.la-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.la-check input {
  width: 18px;
  height: 18px;
  accent-color: var(--pink);
}
.la-filters .dm-link {
  justify-self: start;
  font-size: 14px;
  color: var(--muted);
}

.la-results {
  min-width: 0;
}
.la-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  color: var(--muted);
}
.la-grid {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
.la-card {
  display: grid;
  gap: 8px;
}
.la-card-open {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  max-width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 14px;
  background: #fff;
  cursor: pointer;
}
.la-card-open:hover {
  box-shadow: inset 0 0 0 2px var(--pink-soft);
}
.la-card.is-out .la-card-open {
  opacity: 0.55;
}
.la-card h3 {
  font-size: 17px;
  font-weight: 600;
}
.la-card h3 button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: left;
}
.la-card p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.la-card-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}
.la-stock {
  font-size: 12px;
  font-weight: 700;
}
.la-stock.is-low {
  color: #a35d00;
}
.la-stock.is-out {
  color: var(--pink);
}
.la-empty {
  grid-column: 1 / -1;
  padding: 30px 0;
  color: var(--muted);
}
.la-jar {
  width: 100%;
  height: 100%;
  display: block;
}
.la-foot {
  padding: 20px 22px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
}

@container (min-width: 640px) {
  .la-shop {
    grid-template-columns: 200px 1fr;
    gap: 28px;
  }
  .la-filters {
    position: sticky;
    top: 76px;
    padding-top: 4px;
  }
}

/* Slide-over: product detail, bag, orders, inbox */
.la-panel {
  position: absolute;
  inset: 33px 0 0 auto;
  z-index: 20;
  width: min(440px, 100%);
  background: var(--paper);
  border-left: 1px solid var(--line);
  box-shadow: -24px 0 50px -30px rgba(43, 31, 46, 0.5);
  overflow: auto;
  overscroll-behavior: contain;
  container-type: inline-size;
}
.la-panel-in {
  display: grid;
  gap: 14px;
  padding: 22px 22px 34px;
}
.la-panel h3 {
  font-size: 26px;
  padding-right: 70px;
}
.la-panel h4 {
  margin: 8px 0 0;
  font: 700 12px var(--body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.la-close {
  position: absolute;
  top: 16px;
  right: 16px;
  font: 600 13px var(--body);
  padding: 8px 12px;

<body>
<script>
// Shared runtime for the split-screen demos: a small local data store,
// demo email, sign-in, a test-mode card checkout and the split-screen frame.
// Everything runs in the browser. Nothing is sent over the network.

(function () {
  'use strict';

  const Demo = {};

  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  Demo.esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ESCAPES[c]);

  Demo.money = (cents, { round = false } = {}) => {
    const dollars = cents / 100;
    return dollars.toLocaleString('en-US', {
      style: 'currency',
      currency: 'USD',
      maximumFractionDigits: round ? 0 : 2,
      minimumFractionDigits: round ? 0 : 2,
    });
  };

  Demo.uid = (prefix) => {
    const bytes = crypto.getRandomValues(new Uint8Array(5));
    return (
      prefix +
      '_' +
      Array.from(bytes, (b) => b.toString(36).padStart(2, '0'))
        .join('')
        .slice(0, 8)
    );
  };

  Demo.ago = (ts) => {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' hr ago';
    return Math.round(s / 86400) + ' d ago';
  };

  Demo.dayKey = (date) => {
    const d = new Date(date);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  Demo.addDays = (n, from = new Date()) => {
    const d = new Date(from);
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + n);
    return d;
  };

  Demo.fromDayKey = (key) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d, 12);
  };

  Demo.niceDay = (key, opts = { weekday: 'short', month: 'short', day: 'numeric' }) =>
    Demo.fromDayKey(key).toLocaleDateString('en-US', opts);

  Demo.niceTime = (hhmm) => {
    const [h, m] = hhmm.split(':').map(Number);
    const suffix = h >= 12 ? 'pm' : 'am';
    const hour = ((h + 11) % 12) + 1;
    return m ? `${hour}:${String(m).padStart(2, '0')}${suffix}` : `${hour}${suffix}`;
  };

  // ---------------------------------------------------------------------------
  // Store
  //
  // One JSON document per demo, saved to localStorage when the browser allows
  // it. Both views read from the same store, so a change made on one side shows
  // up on the other right away. Other tabs stay in sync through the storage
  // event.

  Demo.createStore = function (key, seed) {
    const listeners = [];
    let state = read() || seed();

    function read() {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function write() {
      try {
        localStorage.setItem(key, JSON.stringify(state));
      } catch {
        // Storage can be blocked (private windows, previews). The demo keeps
        // working in memory for this visit.
      }
    }

    function emit(event) {
      listeners.forEach((fn) => fn(event));
    }

    function commit(event) {
      event.at = Date.now();
      if (event.note) {
        state.activity = state.activity || [];
        state.activity.unshift({ id: Demo.uid('act'), at: event.at, by: event.by, note: event.note });
        state.activity.length = Math.min(state.activity.length, 80);
      }
      write();
      emit(event);
    }

    window.addEventListener('storage', (e) => {
      if (e.key !== key) return;
      const fresh = read();
      if (fresh) {
        state = fresh;
        emit({ action: 'sync' });
      }
    });

    const store = {
      get state() {
        return state;
      },
      list(table) {
        return state[table] || (state[table] = []);
      },
      find(table, id) {
        return store.list(table).find((row) => row.id === id);
      },
      insert(table, row, { by, note } = {}) {
        row.id = row.id || Demo.uid(table.slice(0, 3));
        row.createdAt = row.createdAt || Date.now();
        store.list(table).unshift(row);
        commit({ table, action: 'insert', row, by, note });
        return row;
      },
      update(table, id, patch, { by, note } = {}) {
        const row = store.find(table, id);
        if (!row) return null;
        Object.assign(row, patch, { updatedAt: Date.now() });
        commit({ table, action: 'update', row, by, note });
        return row;
      },
      remove(table, id, { by, note } = {}) {
        state[table] = store.list(table).filter((row) => row.id !== id);
        commit({ table, action: 'remove', id, by, note });
      },
      setting(name, value, { by, note } = {}) {
        state.settings = state.settings || {};
        if (value === undefined) return state.settings[name];
        state.settings[name] = value;
        commit({ table: 'settings', action: 'update', name, by, note });
        return value;
      },
      // Save and notify without changing a table (used for session changes).
      touch({ by, note } = {}) {
        commit({ action: 'touch', by, note });
      },
      on(fn) {
        listeners.push(fn);
      },
      reset() {
        state = seed();
        write();
        emit({ action: 'reset' });
      },
    };

    return store;
  };

  // ---------------------------------------------------------------------------
  // Demo email
  //
  // Messages land in an "outbox" table instead of being sent. The customer
  // view shows the ones addressed to the signed-in visitor as an inbox, and the
  // owner view lists everything the business would have sent.

  Demo.sendEmail = function (store, { to, subject, lines, code, by = 'system' }) {
    return store.insert('outbox', { to: to.toLowerCase(), subject, lines, code: code || null, read: false }, { by });
  };

  Demo.renderEmail = function (mail, brand) {
    const body = mail.lines.map((line) => `<p>${Demo.esc(line)}</p>`).join('');
    const code = mail.code ? `<div class="dm-mail-code">${Demo.esc(mail.code)}</div>` : '';
    return `
      <article class="dm-mail">
        <header>
          <div class="dm-mail-from">${Demo.esc(brand)} <span>&lt;no-reply@sample.test&gt;</span></div>
          <div class="dm-mail-to">To: ${Demo.esc(mail.to)} · ${Demo.ago(mail.createdAt)}</div>
          <h4>${Demo.esc(mail.subject)}</h4>
        </header>
        ${body}${code}
      </article>`;
  };

  // ---------------------------------------------------------------------------
  // Accounts
  //
  // Passwords are hashed with PBKDF2 (Web Crypto) before they are stored.
  // New accounts confirm their email with a six-digit code, and repeated wrong
  // passwords lock sign-in for 30 seconds.

  const PBKDF2_ROUNDS = 120000;
  const LOCK_AFTER = 5;
  const LOCK_MS = 30000;

  const toHex = (buffer) => Array.from(new Uint8Array(buffer), (b) => b.toString(16).padStart(2, '0')).join('');

  async function hashPassword(password, saltHex) {
    const salt = saltHex ? Uint8Array.from(saltHex.match(/../g), (h) => parseInt(h, 16)) : crypto.getRandomValues(new Uint8Array(16));
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: PBKDF2_ROUNDS }, keyMaterial, 256);
    return { salt: toHex(salt), hash: toHex(bits) };
  }

  function sixDigitCode() {
    const n = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;
    return String(n).padStart(6, '0');
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  Demo.createAuth = function (store, { brand }) {
    const failures = {};

    function sendCode(user) {
      const code = sixDigitCode();
      store.update('users', user.id, { code, codeExpires: Date.now() + 10 * 60 * 1000 });
      Demo.sendEmail(store, {
        to: user.email,
        subject: `Your ${brand} confirmation code`,
        lines: [`Hi ${user.name.split(' ')[0]},`, 'Enter this code to confirm your email address. It expires in 10 minutes.'],
        code,
      });
    }

    const auth = {
      current() {
        const session = store.state.session;
        return session ? store.find('users', session.userId) || null : null;
      },

      async signUp({ name, email, password }) {
        name = name.trim();
        email = email.trim().toLowerCase();
        if (name.length < 2) throw new Error('Enter your name.');
        if (!EMAIL_RE.test(email)) throw new Error('Enter a valid email address.');
        if (password.length < 8) throw new Error('Use at least 8 characters for your password.');
        if (store.list('users').some((u) => u.email === email)) throw new Error('That email already has an account. Sign in instead.');
        const { salt, hash } = await hashPassword(password);
        const user = store.insert('users', { name, email, salt, hash, verified: false }, { by: 'customer', note: `New account: ${name}` });
        sendCode(user);
        return user;
      },

      verify(email, code) {
        const user = store.list('users').find((u) => u.email === email.trim().toLowerCase());
        if (!user) throw new Error('We could not find that account.');
        if (!user.code || Date.now() > user.codeExpires) throw new Error('That code has expired. Send a new one.');
        if (code.trim() !== user.code) throw new Error('That code does not match. Check the latest email.');
        store.state.session = { userId: user.id, at: Date.now() };
        store.update('users', user.id, { verified: true, code: null }, { by: 'customer', note: `${user.name} confirmed their email` });
        return user;
      },

      resend(email) {
        const user = store.list('users').find((u) => u.email === email.trim().toLowerCase());
        if (user && !user.verified) sendCode(user);
      },

      async signIn(email, password) {
        email = email.trim().toLowerCase();
        const lock = failures[email];
        if (lock && lock.until > Date.now()) {
          throw new Error(`Too many attempts. Try again in ${Math.ceil((lock.until - Date.now()) / 1000)} seconds.`);
        }
        const user = store.list('users').find((u) => u.email === email);
        const attempt = user ? await hashPassword(password, user.salt) : null;
        if (!user || attempt.hash !== user.hash) {
          const f = (failures[email] = failures[email] || { count: 0, until: 0 });
          f.count += 1;
          if (f.count >= LOCK_AFTER) {
            f.count = 0;
            f.until = Date.now() + LOCK_MS;
          }
          throw new Error('Email or password is incorrect.');
        }
        delete failures[email];
        if (!user.verified) {
          sendCode(user);
          const err = new Error('Confirm your email first. We sent a new code.');
          err.needsCode = true;
          throw err;
        }
        store.state.session = { userId: user.id, at: Date.now() };
        store.touch();
        return user;
      },

      signOut() {
        store.state.session = null;
        store.touch();
      },
    };

    return auth;
  };

  // Sign-in / sign-up / confirm-code card. Calls onDone(user) when signed in.
  Demo.mountAuthForm = function (container, auth, { onDone, intro = 'Sign in or create a free account.' }) {
    // A fresh host element each time, so remounting never stacks listeners.
    const root = document.createElement('div');
    container.replaceChildren(root);
    let mode = 'signin';
    let pendingEmail = '';

    function render(error = '') {
      const err = error ? `<p class="dm-err" role="alert">${Demo.esc(error)}</p>` : '';
      if (mode === 'code') {
        root.innerHTML = `
          <form class="dm-auth" data-form="code" novalidate>

            <button class="dm-link" type="button" data-auth="resend">Send a new code</button>

      }
      const signup = mode === 'signup';
      root.innerHTML = `
        <form class="dm-auth" data-form="${mode}" novalidate>
          <div class="dm-seg" role="tablist">
            <button type="button" role="tab" aria-selected="${!signup}" data-auth="signin">Sign in</button>
            <button type="button" role="tab" aria-selected="${signup}" data-auth="signup">Create account</button>

          <label for="dm-email">Email</label>

          <label for="dm-pass">Password</label>

          ${signup ? '<p class="dm-hint">At least 8 characters. Use a made-up password, this is a demo.</p>' : ''}
          ${err}
          <button class="dm-btn" type="submit">${signup ? 'Create account' : 'Sign in'}</button>
        </form>`;
    }

    root.addEventListener('click', (e) => {
      const action = e.target.closest('[data-auth]')?.dataset.auth;
      if (!action) return;
      if (action === 'resend') {
        auth.resend(pendingEmail);
        render('A new code is in your inbox.');
        return;
      }
      mode = action;
      render();
    });

    root.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        if (mode === 'signup') {
          const user = await auth.signUp(data);
          pendingEmail = user.email;
          mode = 'code';
          render();
        } else if (mode === 'signin') {
          pendingEmail = data.email;
          onDone(await auth.signIn(data.email, data.password));
        } else {
          onDone(auth.verify(pendingEmail, data.code));
        }
      } catch (err) {
        if (err.needsCode) mode = 'code';
        render(err.message);
      }
    });

  // ---------------------------------------------------------------------------
  // Test-mode card checkout
  //
  // Mirrors how Stripe behaves in test mode: only published test card numbers
  // work, so nobody can type a real card into a demo. The card number is never
  // stored; a successful payment keeps the brand and last four digits.

  const TEST_CARDS = {
    4242424242424242: { brand: 'Visa', result: 'ok' },
    5555555555554444: { brand: 'Mastercard', result: 'ok' },
    378282246310005: { brand: 'Amex', result: 'ok' },
    4000002500003155: { brand: 'Visa', result: 'auth' },
    4000000000000002: { brand: 'Visa', result: 'declined' },
    4000000000009995: { brand: 'Visa', result: 'funds' },
  };

  function passesLuhn(digits) {
    let sum = 0;
    for (let i = 0; i < digits.length; i++) {
      let n = Number(digits[digits.length - 1 - i]);
      if (i % 2) {
        n *= 2;
        if (n > 9) n -= 9;
      }
      sum += n;
    }
    return digits.length >= 13 && sum % 10 === 0;
  }

  function cardError(digits, expiry, cvc) {
    if (!passesLuhn(digits)) return 'Your card number is incomplete or invalid.';
    const match = expiry.match(/^(\d{2})\s*\/\s*(\d{2})$/);
    if (!match || Number(match[1]) < 1 || Number(match[1]) > 12) return 'Enter the expiration date as MM / YY.';
    const end = new Date(2000 + Number(match[2]), Number(match[1]), 1);
    if (end <= new Date()) return "Your card's expiration date is in the past.";
    if (!/^\d{3,4}$/.test(cvc)) return "Your card's security code is incomplete.";
    return '';
  }

  Demo.checkout = function (pane, { amount, label, email = '' }) {
    return new Promise((resolve, reject) => {
      const layer = document.createElement('div');
      layer.className = 'dm-layer';
      layer.innerHTML = `
        <form class="dm-pay" novalidate aria-labelledby="dm-pay-title">

          <input id="dm-pay-card" name="card" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242">
          <div class="dm-pay-row">
            <div><label for="dm-pay-exp">Expiry</label><input id="dm-pay-exp" name="exp" inputmode="numeric" placeholder="MM / YY" autocomplete="off"></div>
            <div><label for="dm-pay-cvc">CVC</label><input id="dm-pay-cvc" name="cvc" inputmode="numeric" maxlength="4" placeholder="123" autocomplete="off"></div>
            <div><label for="dm-pay-zip">ZIP</label><input id="dm-pay-zip" name="zip" inputmode="numeric" maxlength="5" placeholder="76063" autocomplete="off"></div>
          </div>
          <p class="dm-err" role="alert" hidden></p>
          <button class="dm-btn" type="submit">Pay ${Demo.money(amount)}</button>
          <button class="dm-link" type="button" data-pay="cancel">Cancel</button>
          <details class="dm-pay-cards" open>
            <summary>Test cards</summary>
            <ul>
              <li><button type="button" data-fill="4242424242424242">4242 4242 4242 4242</button> payment succeeds</li>
              <li><button type="button" data-fill="4000002500003155">4000 0025 0000 3155</button> asks the bank to confirm</li>
              <li><button type="button" data-fill="4000000000000002">4000 0000 0000 0002</button> card is declined</li>
            </ul>
            <p>Use any future expiry and any 3 digits. Real cards are refused.</p>
          </details>
        </form>`;
      pane.appendChild(layer);

      const form = layer.querySelector('form');
      const errorBox = form.querySelector('.dm-err');
      const cardInput = form.card;
      const expInput = form.exp;
      cardInput.focus();

      cardInput.addEventListener('input', () => {
        const digits = cardInput.value.replace(/\D/g, '').slice(0, 16);
        cardInput.value = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
      });
      expInput.addEventListener('input', () => {
        const d = expInput.value.replace(/\D/g, '').slice(0, 4);
        expInput.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : d;
      });

      function close() {
        layer.remove();
      }

      function fail(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        form.querySelector('button[type="submit"]').disabled = false;
      }

      layer.addEventListener('click', (e) => {
        const fill = e.target.closest('[data-fill]');
        if (fill) {
          cardInput.value = fill.dataset.fill.replace(/(\d{4})(?=\d)/g, '$1 ');
          const next = new Date();
          expInput.value = '12 / ' + String((next.getFullYear() + 3) % 100).padStart(2, '0');
          form.cvc.value = '123';
          form.zip.value = '76063';
        }
        if (e.target.closest('[data-pay="cancel"]')) {
          close();
          reject(new Error('cancelled'));
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const digits = cardInput.value.replace(/\D/g, '');
        const problem = cardError(digits, expInput.value, form.cvc.value.trim());
        if (problem) return fail(problem);
        if (!EMAIL_RE.test(form.email.value.trim())) return fail('Enter an email for the receipt.');

        const card = TEST_CARDS[digits];
        const submit = form.querySelector('button[type="submit"]');
        submit.disabled = true;
        submit.textContent = 'Processing…';

        setTimeout(() => {
          submit.textContent = `Pay ${Demo.money(amount)}`;
          if (!card) return fail('Your card was declined. This demo runs in test mode, so real cards are refused. Use a test card below.');
          if (card.result === 'declined') return fail('Your card was declined. Try a different card.');
          if (card.result === 'funds') return fail('Your card has insufficient funds.');

          const payment = {
            id: Demo.uid('pi_test'),
            brand: card.brand,
            last4: digits.slice(-4),
            amount,
            email: form.email.value.trim().toLowerCase(),
          };
          if (card.result === 'auth') return confirmWithBank(payment);
          close();
          resolve(payment);
        }, 700);
      });

      function confirmWithBank(payment) {
        form.innerHTML = `
          <div class="dm-pay-mode">Test mode · bank check</div>
          <h3>Confirm this payment</h3>
          <p class="dm-muted">Your bank asks you to approve ${Demo.money(payment.amount)}. In real life this is a text code or a tap in your banking app.</p>
          <button class="dm-btn" type="button" data-bank="ok">Approve payment</button>
          <button class="dm-link" type="button" data-bank="no">Fail the check</button>`;
        form.addEventListener('click', (e) => {
          const choice = e.target.closest('[data-bank]')?.dataset.bank;
          if (!choice) return;
          close();
          if (choice === 'ok') resolve(payment);
          else reject(new Error('Your bank did not approve the payment.'));
        });
      }
    });
  };

  // ---------------------------------------------------------------------------
  // Small UI helpers

  Demo.toast = function (pane, message) {
    let stack = pane.querySelector(':scope > .dm-toasts');
    if (!stack) {
      stack = document.createElement('div');
      stack.className = 'dm-toasts';
      stack.setAttribute('role', 'status');
      pane.appendChild(stack);
    }
    const el = document.createElement('div');
    el.className = 'dm-toast';
    el.textContent = message;
    stack.appendChild(el);
    while (stack.children.length > 3) stack.firstElementChild.remove();
    setTimeout(() => el.classList.add('is-out'), 2600);
    setTimeout(() => el.remove(), 3000);
  };

  // Clicks on [data-act="name"] call handlers[name](element, event).
  Demo.delegate = function (root, handlers, type = 'click') {
    root.addEventListener(type, (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || !root.contains(el)) return;
      const fn = handlers[el.dataset.act];
      if (fn) fn(el, e);
    });
  };

  Demo.mountFrame = function ({ name, product, store, steps, ownerLabel = 'Owner view', ownerNote = 'the business login' }) {
    const hubHref = document.body.dataset.hub || 'index.html';
    // Single-file builds keep their styles in <body>; keep them when the

          <div class="dm-plabel"><span class="dm-live"></span>Customer view <small>what visitors see</small></div>
          <div class="dm-scroll"><div class="dm-app" id="customer"></div></div>
        </section>
        <section class="dm-pane" data-pane="owner" aria-label="${Demo.esc(ownerLabel)}">
          <div class="dm-plabel"><span class="dm-live"></span>${Demo.esc(ownerLabel)} <small>${Demo.esc(ownerNote)}</small></div>
          <div class="dm-scroll"><div class="dm-app" id="owner"></div></div>
        </section>
      </main>`;

    const split = document.querySelector('.dm-split');
    const narrow = window.matchMedia('(max-width: 860px)');
    let view = narrow.matches ? 'customer' : 'both';
    try {
      view = sessionStorage.getItem('dm-view:' + product) || view;
    } catch {}

    function applyView() {
      if (narrow.matches && view === 'both') view = 'customer';
      split.dataset.view = view;
      document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
      const badge = document.querySelector(`[data-badge="${view}"]`);
      if (badge) {
        badge.hidden = true;
        badge.textContent = '';
      }
    }
    narrow.addEventListener('change', () => {
      if (!narrow.matches) view = 'both';
      applyView();
    });

    document.querySelector('.dm-views').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-view]');
      if (!btn) return;
      view = btn.dataset.view;
      try {
        sessionStorage.setItem('dm-view:' + product, view);
      } catch {}
      applyView();
    });

    const guide = document.querySelector('.dm-guide');
    const guideBtn = document.querySelector('[data-tool="guide"]');
    const resetBtn = document.querySelector('[data-tool="reset"]');
    let resetArmed = null;

    document.querySelector('.dm-tools').addEventListener('click', (e) => {
      const tool = e.target.closest('[data-tool]')?.dataset.tool;
      if (tool === 'guide') {
        guide.hidden = !guide.hidden;
        guideBtn.setAttribute('aria-expanded', String(!guide.hidden));
      }
      if (tool === 'reset') {
        if (!resetArmed) {
          resetBtn.textContent = 'Tap again';
          resetArmed = setTimeout(() => {
            resetBtn.textContent = 'Reset';
            resetArmed = null;
          }, 3000);
          return;
        }
        clearTimeout(resetArmed);
        resetArmed = null;
        resetBtn.textContent = 'Reset';
        store.reset();
      }
    });

    // When one side changes something, light up the other side.
    store.on((event) => {
      if (!event.note || (event.by !== 'customer' && event.by !== 'owner')) return;
      const other = event.by === 'customer' ? 'owner' : 'customer';
      const pane = document.querySelector(`[data-pane="${other}"]`);
      pane.classList.remove('is-pinged');
      void pane.offsetWidth;
      pane.classList.add('is-pinged');
      Demo.toast(pane, event.note);
      if (split.dataset.view === event.by) {
        const badge = document.querySelector(`[data-badge="${other}"]`);
        badge.textContent = String(Number(badge.textContent || 0) + 1);
        badge.hidden = false;
      }
    });

    applyView();
    return {
      customer: document.getElementById('customer'),
      owner: document.getElementById('owner'),
      customerPane: document.querySelector('[data-pane="customer"]'),
      ownerPane: document.querySelector('[data-pane="owner"]'),
    };
  };

  window.Demo = Demo;
})();

  const slot = (name) => C.querySelector(`[data-slot="${name}"]`);

  function jar(p, big = false) {
    const h = p.size === '3-wick bowl' ? 54 : p.size === '8 oz tin' ? 46 : 76;
    const w = p.size === '3-wick bowl' ? 96 : p.size === '8 oz tin' ? 70 : 62;
    const x = (120 - w) / 2;
    const y = 112 - h;
    const wicks = p.size === '3-wick bowl' ? [-22, 0, 22] : [0];
    return `<svg class="la-jar${big ? ' is-big' : ''}" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse cx="60" cy="114" rx="${w / 2 + 6}" ry="4" fill="rgba(43,31,46,.12)"/>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${p.size === '8 oz tin' ? 6 : 10}" fill="${p.wax}"/>
      <ellipse cx="60" cy="${y + 4}" rx="${w / 2 - 2}" ry="5" fill="#fff" opacity=".35"/>
      ${wicks.map((dx) => `<rect x="${59 + dx}" y="${y - 9}" width="2" height="10" rx="1" fill="#2b1f2e"/>`).join('')}
      <rect x="${x + 8}" y="${y + h * 0.38}" width="${w - 16}" height="${Math.max(16, h * 0.34)}" rx="2" fill="${p.label}"/>
      <text x="60" y="${y + h * 0.38 + Math.max(16, h * 0.34) / 2 + 4}" text-anchor="middle" font-size="10" font-family="Fraunces, Georgia, serif" fill="#fff">L&amp;A</text>
    </svg>`;
  }

  function visibleProducts() {
    const q = filters.q.trim().toLowerCase();
    let list = store.list('products').filter((p) => p.active);
    if (filters.families.size) list = list.filter((p) => filters.families.has(p.family));
    if (filters.size) list = list.filter((p) => p.size === filters.size);
    list = list.filter((p) => p.price <= filters.maxPrice);
    if (filters.inStock) list = list.filter((p) => p.stock > 0);
    if (q) list = list.filter((p) => (p.name + ' ' + p.family + ' ' + p.size + ' ' + p.notes).toLowerCase().includes(q));
    const sorts = {
      featured: (a, b) => (b.stock > 0) - (a.stock > 0) || a.added - b.added,
      low: (a, b) => a.price - b.price,
      high: (a, b) => b.price - a.price,
      name: (a, b) => a.name.localeCompare(b.name),
    };
    return list.sort(sorts[filters.sort]);
  }

  function stockNote(p) {
    if (p.stock <= 0) return '<span class="la-stock is-out">Sold out</span>';
    if (p.stock <= 3) return `<span class="la-stock is-low">Only ${p.stock} left</span>`;
    return '';
  }

  function renderGrid() {
    const list = visibleProducts();
    const active = store.list('products').filter((p) => p.active).length;
    slot('count').textContent = list.length === active ? `${active} candles` : `${list.length} of ${active} candles`;
    slot('grid').innerHTML = list.length
      ? list
          .map(
            (p) => `
        <li class="la-card${p.stock <= 0 ? ' is-out' : ''}">
          <button type="button" class="la-card-open" data-act="view" data-id="${p.id}" aria-label="${esc(p.name)} details">${jar(p)}</button>
          <div class="la-card-txt">
            <h3><button type="button" data-act="view" data-id="${p.id}">${esc(p.name)}</button></h3>
            <p>${esc(p.family)} · ${esc(p.size)}</p>
            <div class="la-card-row"><b>${money(p.price)}</b>${stockNote(p)}</div>
          </div>
        </li>`,
          )
          .join('')
      : '<li class="la-empty">No candles match those filters. <button type="button" class="dm-link" data-act="clear">Clear filters</button></li>';
  }

  function renderHeader() {
    slot('bagcount').textContent = String(bag.reduce((n, l) => n + l.qty, 0));
    const unread = store.list('outbox').filter((m) => m.to !== OWNER_EMAIL && !m.read).length;
    slot('inbox').textContent = unread ? ' ' + unread : '';
  }

  function totals() {
    const subtotal = bag.reduce((n, l) => n + product(l.id).price * l.qty, 0);
    const discount = store.list('discounts').find((d) => d.id === code && d.active);
    const off = discount ? Math.round((subtotal * discount.percent) / 100) : 0;
    const shipping = subtotal - off >= FREE_SHIPPING_AT || !subtotal ? 0 : SHIPPING;
    const tax = Math.round((subtotal - off) * TAX_RATE);
    return { subtotal, off, discount, shipping, tax, total: subtotal - off + shipping + tax };
  }

  // Bag lines can go stale when the owner changes stock, so clamp them.
  function fitBagToStock() {
    let changed = false;
    bag = bag
      .map((l) => {
        const p = product(l.id);
        const qty = p && p.active ? Math.min(l.qty, p.stock) : 0;
        if (qty !== l.qty) changed = true;
        return { ...l, qty };
      })
      .filter((l) => l.qty > 0);
    return changed;
  }

  function openPanel(kind, id) {
    panel = kind;
    viewing = id || viewing;
    renderPanel();
  }
  function closePanel() {
    panel = null;
    frame.customerPane.querySelector('.la-panel')?.remove();
  }

  function renderPanel() {
    let el = frame.customerPane.querySelector('.la-panel');
    if (!panel) return el?.remove();
    if (!el) {
      el = document.createElement('aside');
      el.className = 'la-panel';
      frame.customerPane.appendChild(el);
      Demo.delegate(el, actions);
      el.addEventListener('submit', onCheckoutSubmit);
    }
    const draft = el.querySelector('form[data-form="ship"]')
      ? Object.fromEntries(new FormData(el.querySelector('form[data-form="ship"]')))
      : null;
    el.innerHTML = `<div class="la-panel-in"><button type="button" class="la-close" data-act="close">Close</button>${{ view: viewPanel, bag: bagPanel, orders: ordersPanel, inbox: inboxPanel }[panel]()}</div>`;
    if (draft) {
      const form = el.querySelector('form[data-form="ship"]');
      if (form) Object.entries(draft).forEach(([k, v]) => form.elements[k] && (form.elements[k].value = v));
    }
  }

  function viewPanel() {
    const p = product(viewing);
    const inBag = bag.find((l) => l.id === p.id)?.qty || 0;
    const canAdd = p.active && p.stock - inBag > 0;
    return `
      <div class="la-view">
        ${jar(p, true)}
        <p class="la-kicker">${esc(p.family)} · ${esc(p.size)}</p>
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.notes)}</p>
        <dl class="la-specs"><dt>Burn time</dt><dd>${p.size === '8 oz tin' ? '35' : p.size === '12 oz jar' ? '60' : '45'} hours</dd><dt>Wax</dt><dd>Soy and coconut</dd><dt>In stock</dt><dd>${p.stock > 0 ? p.stock : 'Sold out'}</dd></dl>
        <div class="la-view-buy"><b>${money(p.price)}</b>
          <button type="button" class="dm-btn" data-act="add" data-id="${p.id}" ${canAdd ? '' : 'disabled'}>${p.stock <= 0 ? 'Sold out' : canAdd ? 'Add to bag' : 'All in your bag'}</button>
        </div>
        ${inBag ? `<p class="dm-muted">${inBag} in your bag. <button type="button" class="dm-link" data-act="open-panel" data-panel="bag">View bag</button></p>` : ''}
      </div>`;
  }

  function bagPanel() {
    if (!bag.length) return '<h3>Your bag</h3><p class="dm-muted">Your bag is empty.</p>';
    const t = totals();
    return `
      <h3>Your bag</h3>
      <ul class="la-lines">${bag
        .map((l) => {
          const p = product(l.id);
          return `<li>${jar(p)}<div><b>${esc(p.name)}</b><span>${esc(p.size)} · ${money(p.price)}</span>
            <span class="la-qty"><button type="button" data-act="qty" data-id="${p.id}" data-d="-1" aria-label="One less">−</button>${l.qty}<button type="button" data-act="qty" data-id="${p.id}" data-d="1" aria-label="One more" ${l.qty >= p.stock ? 'disabled' : ''}>+</button></span></div>
            <b>${money(p.price * l.qty)}</b></li>`;
        })
        .join('')}</ul>
      <form class="la-code" data-form="code"><label for="la-code">Discount code</label><div><input id="la-code" name="code" value="${esc(code)}" autocomplete="off" placeholder="LAKE10"><button type="submit" class="la-ghost">Apply</button></div>
        ${code && !t.discount ? '<p class="dm-err">That code is not active.</p>' : ''}</form>
      <dl class="la-sum">
        <dt>Subtotal</dt><dd>${money(t.subtotal)}</dd>
        ${t.discount ? `<dt>${esc(t.discount.id)} (${t.discount.percent}% off)</dt><dd>−${money(t.off)}</dd>` : ''}
        <dt>Shipping</dt><dd>${t.shipping ? money(t.shipping) : 'Free'}</dd>
        <dt>Tax</dt><dd>${money(t.tax)}</dd>
        <dt class="la-total">Total</dt><dd class="la-total">${money(t.total)}</dd>
      </dl>
      ${t.shipping ? `<p class="la-nudge">Add ${money(FREE_SHIPPING_AT - (t.subtotal - t.off))} more for free shipping.</p>` : ''}
      <form class="la-ship" data-form="ship" novalidate>
        <h4>Ship to</h4>
        <label for="la-name">Full name</label><input id="la-name" name="name" autocomplete="name" required>
        <label for="la-email">Email</label><input id="la-email" name="email" type="email" autocomplete="email" value="${esc(lastEmail)}" required>
        <label for="la-addr">Street address</label><input id="la-addr" name="address" autocomplete="street-address" required>
        <div class="la-two"><div><label for="la-city">City</label><input id="la-city" name="city" autocomplete="address-level2" required></div>
        <div><label for="la-zip">ZIP</label><input id="la-zip" name="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code" required></div></div>
        <p class="dm-err" data-slot="ship-err" hidden></p>
        <button type="submit" class="dm-btn">Continue to payment</button>
      </form>`;
  }

  const ORDER_STEPS = ['paid', 'packed', 'shipped'];
  const ORDER_TEXT = { paid: 'Order placed', packed: 'Packed', shipped: 'Shipped', refunded: 'Refunded' };

  function ordersPanel() {
    const mine = lastEmail ? store.list('orders').filter((o) => o.email === lastEmail) : [];
    const lookup = `<form class="la-code" data-form="lookup"><label for="la-look">Email used at checkout</label><div><input id="la-look" name="email" type="email" value="${esc(lastEmail)}" placeholder="you@example.com"><button type="submit" class="la-ghost">Find orders</button></div></form>`;
    const list = mine.length
      ? `<ul class="la-orders">${mine
          .map((o) => {
            const step = ORDER_STEPS.indexOf(o.status);
            return `<li><div class="la-order-top"><b>Order #${o.number}</b><span>${money(o.total)}</span></div>
              <p>${o.items.map((l) => `${l.qty}× ${esc(product(l.id)?.name || 'Item')}`).join(', ')}</p>
              ${o.status === 'refunded' ? '<p class="la-stock is-out">Refunded to your card</p>' : `<ol class="la-track">${ORDER_STEPS.map((s, i) => `<li class="${i <= step ? 'is-done' : ''}">${ORDER_TEXT[s]}</li>`).join('')}</ol>`}
              ${o.tracking ? `<p class="dm-muted">Tracking: ${esc(o.tracking)}</p>` : ''}</li>`;
          })
          .join('')}</ul>`
      : lastEmail
        ? '<p class="dm-muted">No orders for that email yet.</p>'
        : '';
    return `<h3>My orders</h3>${lookup}${list}`;
  }

  function inboxPanel() {
    const mail = store.list('outbox').filter((m) => m.to !== OWNER_EMAIL);
    mail.forEach((m) => (m.read = true));
    renderHeader();
    return `<h3>Demo inbox</h3><p class="dm-muted">Emails the shop sends to customers land here instead of going out.</p>
      <div class="la-mail">${mail.map((m) => Demo.renderEmail(m, BRAND)).join('') || '<p class="dm-muted">Nothing yet. Place an order to get a receipt.</p>'}</div>`;
  }

  async function onCheckoutSubmit(e) {
    e.preventDefault();
    const form = e.target;
    if (form.dataset.form === 'code') {
      code = form.code.value.trim().toUpperCase();
      return renderPanel();
    }
    if (form.dataset.form === 'lookup') {
      lastEmail = form.email.value.trim().toLowerCase();
      return renderPanel();
    }
    const data = Object.fromEntries(new FormData(form));
    const err = form.querySelector('[data-slot="ship-err"]');
    const missing = ['name', 'email', 'address', 'city', 'zip'].find((k) => !String(data[k] || '').trim());
    if (missing) {
      err.textContent = 'Fill in every shipping field.';
      err.hidden = false;
      return;
    }
    if (!/^\d{5}$/.test(data.zip)) {
      err.textContent = 'Enter a 5-digit ZIP code.';
      err.hidden = false;
      return;
    }
    if (fitBagToStock()) {
      renderPanel();
      Demo.toast(frame.customerPane, 'Stock changed while you were shopping. We updated your bag.');
      return;
    }
    const t = totals();
    let payment;
    try {
      payment = await Demo.checkout(frame.customerPane, {
        amount: t.total,
        label: `${BRAND} · ${bag.reduce((n, l) => n + l.qty, 0)} items`,
        email: data.email.trim(),
      });
    } catch (ex) {
      if (ex.message !== 'cancelled') Demo.toast(frame.customerPane, ex.message);
      return;
    }
    placeOrder(data, t, payment);
  }

  function placeOrder(data, t, payment) {
    const number = store.state.nextOrder++;
    bag.forEach((l) => {
      const p = product(l.id);
      p.stock = Math.max(0, p.stock - l.qty);
    });
    if (t.discount) t.discount.uses += 1;
    const order = store.insert(
      'orders',
      {
        number,
        name: data.name.trim(),
        email: payment.email,
        address: `${data.address.trim()}, ${data.city.trim()}, TX ${data.zip}`,
        items: bag.map((l) => ({ ...l })),
        subtotal: t.subtotal,
        discount: t.off,
        code: t.discount?.id || '',
        shipping: t.shipping,
        tax: t.tax,
        total: t.total,
        status: 'paid',
        tracking: '',
        payment: { id: payment.id, brand: payment.brand, last4: payment.last4 },
      },
      { by: 'customer', note: `New order #${number} from ${data.name.trim()}, ${money(t.total)}` },
    );
    Demo.sendEmail(store, {
      to: order.email,
      subject: `Order #${number} confirmed`,
      lines: [
        `Thanks for your order, ${order.name.split(' ')[0]}!`,
        order.items.map((l) => `${l.qty}× ${product(l.id).name}`).join(', '),
        `Total ${money(order.total)}, paid with ${payment.brand} ending ${payment.last4} (test mode).`,
        "We'll email you a tracking number when it ships.",
      ],
    });
    lastEmail = order.email;
    bag = [];
    code = '';
    openPanel('orders');
    Demo.toast(frame.customerPane, `Order #${number} placed. Receipt is in the inbox.`);
  }

  const actions = {
    view: (el) => openPanel('view', el.dataset.id),
    'open-panel': (el) => openPanel(el.dataset.panel),
    close: closePanel,
    family(el) {
      const f = el.dataset.family;
      filters.families.has(f) ? filters.families.delete(f) : filters.families.add(f);
      el.setAttribute('aria-pressed', String(filters.families.has(f)));
      renderGrid();
    },
    clear() {
      filters.families.clear();
      Object.assign(filters, { size: '', maxPrice: 6000, inStock: false, q: '' });
      C.querySelectorAll('[data-act="family"]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
      C.querySelector('#la-size').value = '';
      C.querySelector('#la-price').value = '6000';
      C.querySelector('#la-stock').checked = false;
      C.querySelector('#la-q').value = '';
      slot('price-out').textContent = 'Up to $60';
      renderGrid();
    },
    add(el) {
      const line = bag.find((l) => l.id === el.dataset.id);
      if (line) line.qty += 1;
      else bag.push({ id: el.dataset.id, qty: 1 });
      renderHeader();
      renderPanel();
      Demo.toast(frame.customerPane, 'Added to your bag');
    },
    qty(el) {
      const line = bag.find((l) => l.id === el.dataset.id);
      line.qty += Number(el.dataset.d);
      bag = bag.filter((l) => l.qty > 0);
      renderHeader();
      renderPanel();
    },
  };
  Demo.delegate(C, actions);

  C.querySelector('#la-q').addEventListener('input', (e) => {
    filters.q = e.target.value;
    renderGrid();
  });
  C.querySelector('#la-size').addEventListener('change', (e) => {
    filters.size = e.target.value;
    renderGrid();
  });
  C.querySelector('#la-price').addEventListener('input', (e) => {
    filters.maxPrice = Number(e.target.value);
    slot('price-out').textContent = `Up to $${filters.maxPrice / 100}`;
    renderGrid();
  });
  C.querySelector('#la-stock').addEventListener('change', (e) => {
    filters.inStock = e.target.checked;
    renderGrid();
  });
  C.querySelector('#la-sort').addEventListener('change', (e) => {
    filters.sort = e.target.value;
    renderGrid();
  });

  // Owner view

  const O = frame.owner;
  let ownerTab = 'orders';

  function ownerStats() {
    const orders = store.list('orders').filter((o) => o.status !== 'refunded');
    const today = orders.filter((o) => Demo.dayKey(o.createdAt) === Demo.dayKey(new Date()));
    const revenue = today.reduce((n, o) => n + o.total, 0);
    const units = today.reduce((n, o) => n + o.items.reduce((m, l) => m + l.qty, 0), 0);
    const toShip = store.list('orders').filter((o) => o.status === 'paid' || o.status === 'packed').length;
    const low = store.list('products').filter((p) => p.active && p.stock <= 3).length;
    return [
      ['Sales today', money(revenue)],
      ['Orders to ship', toShip, toShip ? 'is-warn' : ''],
      ['Candles sold today', units],
      ['Low or sold out', low, low ? 'is-alert' : ''],
    ];
  }

  function productsTab() {

          )
          .join('')}</tbody></table></div>`;
  }

  function discountsTab() {
    return `<p class="dm-muted">Turn codes on and off. Shoppers type them in the bag.</p>
      <ul class="la-o-codes">${store
        .list('discounts')
        .map(
          (d) => `<li><div><b>${esc(d.id)}</b><span>${d.percent}% off the whole order · used ${d.uses} times</span></div>
        <label class="la-o-switch"><input type="checkbox" data-act="code" data-id="${d.id}" ${d.active ? 'checked' : ''}> ${d.active ? 'Active' : 'Off'}</label></li>`,
        )
        .join('')}</ul>`;
  }

  function customersTab() {
    const byEmail = new Map();
    store.list('orders').forEach((o) => {
      const c = byEmail.get(o.email) || { name: o.name, email: o.email, orders: 0, spent: 0, last: 0 };
      c.orders += 1;
      if (o.status !== 'refunded') c.spent += o.total;
      c.last = Math.max(c.last, o.createdAt);
      byEmail.set(o.email, c);
    });
    const rows = [...byEmail.values()].sort((a, b) => b.last - a.last);
    return `<div class="la-o-table"><table><thead><tr><th>Customer</th><th>Orders</th><th>Spent</th><th>Last order</th></tr></thead>
      <tbody>${rows.map((c) => `<tr><td><b>${esc(c.name)}</b><span>${esc(c.email)}</span></td><td>${c.orders}</td><td>${money(c.spent)}</td><td>${Demo.ago(c.last)}</td></tr>`).join('')}</tbody></table></div>`;
  }

  function emailsTab() {
    return `<p class="dm-muted">Every email the shop sent, newest first.</p><div class="la-mail">${
      store
        .list('outbox')
        .map((m) => Demo.renderEmail(m, BRAND))
        .join('') || '<p class="dm-muted">No emails yet.</p>'
    }</div>`;
  }

  function renderOwner() {
    const box = O.closest('.dm-scroll');
    const keep = box.scrollTop;
    const toShip = store.list('orders').filter((o) => o.status === 'paid').length;
    const tabs = [
      ['orders', 'Orders', toShip],
      ['products', 'Products'],
      ['discounts', 'Discounts'],
      ['customers', 'Customers'],
      ['emails', 'Emails'],
    ];
    O.innerHTML = `
      <div class="la-o">
        <header class="la-o-head"><div><b>Lantana &amp; Ash</b><span>Shop admin</span></div><span class="la-o-mode">Test mode</span></header>
        <div class="la-o-stats">${ownerStats()
          .map(([l, v, c]) => `<div class="${c || ''}"><span>${l}</span><b>${v}</b></div>`)
          .join('')}</div>
        <nav class="la-o-tabs">${tabs.map(([id, label, n]) => `<button type="button" data-act="otab" data-tab="${id}" aria-pressed="${id === ownerTab}">${label}${n ? `<span>${n}</span>` : ''}</button>`).join('')}</nav>
        <div class="la-o-body">${{ orders: ordersTab, products: productsTab, discounts: discountsTab, customers: customersTab, emails: emailsTab }[ownerTab]()}</div>
        <section class="la-o-feed"><h4>Live activity</h4><ul>${store
          .list('activity')
          .slice(0, 6)
          .map((a) => `<li class="is-${a.by}">${esc(a.note)}<time>${Demo.ago(a.at)}</time></li>`)
          .join('')}</ul></section>
      </div>`;
    box.scrollTop = keep;
  }

  function trackingNumber(orderNumber) {
    const digits = crypto.getRandomValues(new Uint32Array(2));
    return `9400 1${String(digits[0] % 1000).padStart(3, '0')} ${String(digits[1] % 10000).padStart(4, '0')} 0000 ${orderNumber}`;
  }

  const ownerActions = {
    otab(el) {
      ownerTab = el.dataset.tab;
      renderOwner();
    },
    advance(el) {
      const o = store.find('orders', el.dataset.id);
      const to = el.dataset.to;
      const patch = { status: to };
      if (to === 'shipped') {
        patch.tracking = trackingNumber(o.number);
        Demo.sendEmail(store, {
          to: o.email,
          subject: `Order #${o.number} has shipped`,
          lines: [
            `Good news, ${o.name.split(' ')[0]}! Your candles are on the way.`,
            `USPS tracking: ${patch.tracking}`,
            `Shipping to ${o.address}.`,
          ],
        });
      }
      store.update('orders', o.id, patch, { by: 'owner', note: `Order #${o.number} ${to}` });
    },
    refund(el) {
      const o = store.find('orders', el.dataset.id);
      o.items.forEach((l) => {
        const p = product(l.id);
        if (p) p.stock += l.qty;
      });
      Demo.sendEmail(store, {
        to: o.email,
        subject: `Refund for order #${o.number}`,
        lines: [
          `We refunded ${money(o.total)} to your ${o.payment.brand} ending ${o.payment.last4}.`,
          'It can take 5 to 10 business days to show up.',
        ],
      });
      store.update('orders', o.id, { status: 'refunded' }, { by: 'owner', note: `Refunded order #${o.number}, items back in stock` });
    },
    stock(el) {
      const p = product(el.dataset.id);
      const stock = Math.max(0, p.stock + Number(el.dataset.d));
      store.update('products', p.id, { stock }, { by: 'owner', note: `${p.name} stock set to ${stock}` });
    },
    active(el) {
      const p = product(el.dataset.id);
      store.update(
        'products',
        p.id,
        { active: el.checked },
        { by: 'owner', note: `${p.name} ${el.checked ? 'is back on the shop' : 'hidden from the shop'}` },
      );
    },
    code(el) {
      const d = store.find('discounts', el.dataset.id);
      store.update('discounts', d.id, { active: el.checked }, { by: 'owner', note: `Code ${d.id} turned ${el.checked ? 'on' : 'off'}` });
    },
    price(el) {
      const p = product(el.dataset.id);
      const dollars = Math.round(Number(el.value));
      if (!dollars || dollars < 5 || dollars > 200) {
        el.value = p.price / 100;
        return;
      }
      store.update('products', p.id, { price: dollars * 100 }, { by: 'owner', note: `${p.name} price now ${money(dollars * 100)}` });
    },
  };

  O.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (el && el.tagName !== 'INPUT' && ownerActions[el.dataset.act]) ownerActions[el.dataset.act](el, e);
  });
  O.addEventListener('change', (e) => {
    const el = e.target.closest('input[data-act]');
    if (el && ownerActions[el.dataset.act]) ownerActions[el.dataset.act](el, e);
  });

  store.on((event) => {
    if (event.action === 'reset') {
      bag = [];
      code = '';
      lastEmail = '';
      closePanel();
    }
    if (fitBagToStock()) Demo.toast(frame.customerPane, 'Stock changed. We updated your bag.');
    renderGrid();
    renderHeader();
    if (panel) renderPanel();
    renderOwner();
  });

  renderGrid();
  renderHeader();
  renderOwner();
})();

</script>
</body>
</html>
